<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ciudadano - Bit-Towns</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            color: #00f0ff;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(0, 240, 255, 0.05);
            font-weight: bold;
        }
        .back-btn:hover {
            background: rgba(0, 240, 255, 0.2);
        }
        h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        .form-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
            margin-bottom: 20px;
        }
        .form-card h2 {
            margin-top: 0;
            color: #00f0ff;
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .form-card p {
            color: #a0aec0;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            display: block;
            color: #00f0ff;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            margin-top: 10px;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
        }
        .legal-notice {
            color: #718096;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-btn">← Volver</a>
            <h1>Registro</h1>
        </div>

        <div class="form-card">
            <h2>🚀 Únete al Piloto de Bit-Towns</h2>
            <p>Crea tu identidad digital de ciudadano para reservar tu puesto en la primera fase en Amposta.</p>

            <form id="register-form">
                <div class="form-group">
                    <label for="nickname">Nickname de Ciudadano</label>
                    <input type="text" id="nickname" placeholder="Ej: Citizen_Amposta" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                </div>

                <button type="submit" class="btn-submit" id="btn-submit">🔑 Unirme al Piloto</button>
            </form>
            <div id="status-msg" class="status-msg"></div>
        </div>

        <div class="legal-notice">
            <p>Bit-Towns — Enregistrament inicial per a la fase de prova del projecte.</p>
        </div>
    </div>

    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cxpsktskbvrkwtkolrpl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4cHNrdHNrYnZya3d0a29scnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTc1MjUsImV4cCI6MjEwNzAzMzUyNX0.9RJAEUxalZ3oI9DVWDr8x9s4QPpxWXZwMQBRm9lwVq0';

        let supabaseClient;

        window.addEventListener('DOMContentLoaded', () => {
            try {
                if (typeof supabase !== 'undefined') {
                    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }
            } catch (err) {
                console.error("Error al conectar Supabase:", err);
            }
        });

        const form = document.getElementById('register-form');
        const statusMsg = document.getElementById('status-msg');
        const submitBtn = document.getElementById('btn-submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const nickname = document.getElementById('nickname').value;

            submitBtn.disabled = true;
            statusMsg.style.color = '#00f0ff';
            statusMsg.textContent = 'Registrando ciudadano en la red...';

            if (!supabaseClient) {
                statusMsg.style.color = '#ff4a4a';
                statusMsg.textContent = 'No se ha podido conectar con la base de datos.';
                submitBtn.disabled = false;
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: { nickname: nickname }
                }
            });

            if (error) {
                statusMsg.style.color = '#ff4a4a';
                statusMsg.textContent = 'Error: ' + error.message;
                submitBtn.disabled = false;
            } else {
                statusMsg.style.color = '#00ff88';
                statusMsg.textContent = '¡Registro completado! Revisa tu correo electrónico para confirmar la cuenta.';
                form.reset();
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
