    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ciudadano - Bit-Towns</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        body {
            background-color: #0b0f19;
            color: #ffffff;

            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;

            margin-bottom: 20px;

            background: rgba(0, 240, 255, 0.05);
            font-weight: bold;
        }
        .back-btn:hover {
            background: rgba(0, 240, 255, 0.2);
        }
        h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        .form-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
            margin-bottom: 20px;
        }
        .form-card h2 {
            margin-top: 0;
            color: #00f0ff;
            font-size: 1.2rem;

            text-align: center;
        }
        .form-card p {

            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            display: block;
            color: #00f0ff;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            margin-top: 10px;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
