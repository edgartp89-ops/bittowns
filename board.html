<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Inversiones - Bit-Towns</title>
    <link rel="icon" type="image/png" href="favicon.png?v=1">
    <style>
        /* Barra Superior Unificada Bit-Towns */
        .ht-topbar {
            background-color: #0c0814;
            color: #ffffff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #9333ea;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.35);
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .ht-topbar-nav {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: nowrap;
        }
        /* Estilo unificado para TODOS los enlaces de la barra */
        .ht-topbar a {
            color: #ffffff;
            text-decoration: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .ht-topbar a:hover, .ht-topbar a.active {
            background-color: #9333ea;
            box-shadow: 0 0 10px #a855f7;
        }

        /* Ajuste responsivo compacto para móviles */
        @media (max-width: 768px) {
            .ht-topbar {
                padding: 8px 10px;
            }
            .ht-topbar-nav {
                gap: 6px;
            }
            .ht-topbar a {
                padding: 3px 6px;
                font-size: 12px;
            }
            body {
                padding-top: 60px !important;
            }
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            padding-top: 75px; /* Compensación por la barra fija */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .tabs-bar {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            padding: 14px 36px;
            gap: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 0;
        }
        .tab-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .tab-btn:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(112, 0, 255, 0.15));
            border-color: #00f0ff;
            color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .container {
            max-width: 920px;
            width: 100%;
            margin: 35px auto;
            padding: 0 24px;
            box-sizing: border-box;
            flex: 1;
        }

        .user-constructors-box {
            background: linear-gradient(135deg, rgba(255, 183, 3, 0.08), rgba(255, 140, 0, 0.03));
            border: 1px solid rgba(255, 183, 3, 0.35);
            padding: 18px 24px;
            border-radius: 16px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .section-title {
            color: #f8fafc;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }
        .section-desc {
            color: #94a3b8;
            font-size: 0.92rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .plot-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .plot-card:hover {
            border-color: rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 240, 255, 0.1);
        }

        .plot-card.completed-plot {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.06), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(0, 255, 136, 0.4);
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.08);
        }
        .plot-card.completed-plot:hover {
            border-color: rgba(0, 255, 136, 0.7);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.18);
        }

        .plot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .plot-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .plot-icon-container {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.05);
        }
        .completed-plot .plot-icon-container {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
        }

        .plot-badge {
            font-size: 0.78rem;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .badge-active { background: rgba(0, 240, 255, 0.12); color: #00f0ff; border: 1px solid rgba(0, 240, 255, 0.3); }
        .badge-completed { background: rgba(0, 255, 136, 0.15); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.4); }

        .progress-bar-bg {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin: 16px 0;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .completed-plot .progress-bar-fill {
            background: linear-gradient(90deg, #00ff88, #00f0ff);
        }

        .plot-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            font-size: 0.9rem;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 14px;
        }

        .btn-action {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.25);
        }
        .btn-action:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 240, 255, 0.4);
        }
        .btn-action:disabled {
            background: rgba(0, 255, 136, 0.12);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.3);
            cursor: not-allowed;
            box-shadow: none;
        }

        .buy-property-card {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.04), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(0, 255, 136, 0.25);
            padding: 24px;
            border-radius: 18px;
            margin-bottom: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.92rem;
            margin-bottom: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .type-buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }
        .type-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 12px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
        }
        .type-btn:hover {
            border-color: #00ff88;
            color: #ffffff;
            background: rgba(0, 255, 136, 0.06);
        }
        .type-btn.selected {
            background: rgba(0, 255, 136, 0.15);
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.25);
        }
    </style>
</head>
<body>
    <!-- Barra Superior Unificada Bit-Towns -->
    <div class="ht-topbar">
        <div class="ht-topbar-nav">
            <a href="index.html">🏠 Bit-Towns</a>
            <a href="community.html">👥 Comunitat</a>
            <a href="forum.html">💬 Foro</a>
        </div>
        <div>
            <a href="profile.html">👤 Mi Perfil</a>
        </div>
    </div>

    <!-- Pestañas -->
    <div class="tabs-bar">
        <button class="tab-btn active" id="tab-colective" onclick="switchTab('colective')">🏛️ Inversiones Colectivas DAO</button>
        <button class="tab-btn" id="tab-individual" onclick="switchTab('individual')">🏡 Mis Propiedades Privadas</button>
    </div>

    <div class="container">
        <div class="user-constructors-box">
            <span style="color: #ffb703; font-weight: 600; font-size: 1rem;">Tus Constructors Disponibles:</span>
            <span id="panel-user-constructors" style="color: #ffb703; font-weight: 700; font-size: 1.3rem;">0 🏗️</span>
        </div>

        <div id="main-content-area">
            <!-- Contenido dinámico -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cxpsktskbvrkwtkolrpl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4cHNrdHNrYnZya3d0a29scnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTc1MjUsImV4cCI6MjEwNzAzMzUyNX0.9RJAEUxalZ3oI9DVWDr8x9s4QPpxWXZwMQBRm9lwVq0';

        let supabaseClient;
        let currentUser = null;
        let userConstructorsBalance = 0;
        let currentMode = 'colective';
        let plotsData = [];
        let selectedPropertyIcon = '🏠';
        let selectedPropertyNameDefault = 'Casa Residencial';

        const DEFAULT_AMPOSTA_PLOTS = [
            { id: 1, name: "Plaça del Ajuntament", description: "Centro neurálgico y administrativo de Amposta.", icon: "🏛️", cost_constructors: 10, current_constructors: 0, status: "active" },
            { id: 2, name: "Pont Colgant d'Amposta", description: "Icónico puente colgante sobre el río Ebro.", icon: "🌉", cost_constructors: 15, current_constructors: 0, status: "active" },
            { id: 3, name: "Passeig del Canal", description: "Zona verde y recreativa junto al canal de riego.", icon: "🌳", cost_constructors: 8, current_constructors: 0, status: "active" },
            { id: 4, name: "Zona Comercial del Centre", description: "Eje de comercios locales y tiendas de proximidad.", icon: "🏬", cost_constructors: 12, current_constructors: 0, status: "active" },
            { id: 5, name: "Torre de la Carrova", description: "Torre medieval defensiva a orillas del Ebro.", icon: "🏰", cost_constructors: 20, current_constructors: 0, status: "active" }
        ];

        window.addEventListener('DOMContentLoaded', async () => {
            // Resaltar automáticamente la barra superior activa si corresponde
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.ht-topbar a').forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });

            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                await fetchUserProfile(currentUser.id);
            }

            const urlParams = new URLSearchParams(window.location.search);
            const tabParam = urlParams.get('tab');
            if (tabParam === 'individual') {
                switchTab('individual');
            } else {
                switchTab('colective');
            }
        });

        async function fetchUserProfile(userId) {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('constructors')
                    .eq('id', userId)
                    .single();
                
                if (!error && data) {
                    userConstructorsBalance = data.constructors || 0;
                    const el = document.getElementById('panel-user-constructors');
                    if (el) el.textContent = userConstructorsBalance + ' 🏗️';
                }
            } catch (err) {
                console.error("Error al cargar perfil:", err);
            }
        }

        async function loadPlots() {
            try {
                const { data, error } = await supabaseClient
                    .from('board_plots')
                    .select('*');

                if (error || !data || data.length === 0) {
                    plotsData = DEFAULT_AMPOSTA_PLOTS;
                } else {
                    plotsData = data.map((plot, idx) => {
                        const def = DEFAULT_AMPOSTA_PLOTS[idx] || {};
                        const cost = plot.cost_constructors || def.cost_constructors || 10;
                        const current = plot.current_constructors || 0;
                        const isCompleted = plot.status === 'completed' || current >= cost;
                        return {
                            id: plot.id || def.id || (idx + 1),
                            name: plot.name || def.name || `Parcela ${idx + 1}`,
                            description: plot.description || def.description || 'Proyecto comunitario de Amposta.',
                            icon: plot.icon || def.icon || '🏗️',
                            cost_constructors: cost,
                            current_constructors: current,
                            status: isCompleted ? 'completed' : 'active'
                        };
                    });
                }

                plotsData.sort((a, b) => {
                    const aCompleted = a.status === 'completed' || a.current_constructors >= a.cost_constructors ? 1 : 0;
                    const bCompleted = b.status === 'completed' || b.current_constructors >= b.cost_constructors ? 1 : 0;
                    return bCompleted - aCompleted;
                });

                renderPlotsList();
            } catch (err) {
                console.warn("Usando parcelas por defecto debido a error en Supabase:", err);
                plotsData = DEFAULT_AMPOSTA_PLOTS;
                renderPlotsList();
            }
        }

        function renderPlotsList() {
            const container = document.getElementById('plots-list-container');
            if (!container) return;

            container.innerHTML = '';
            plotsData.forEach(plot => {
                const isCompleted = plot.status === 'completed' || plot.current_constructors >= plot.cost_constructors;
                const percentage = Math.min(100, Math.round((plot.current_constructors / plot.cost_constructors) * 100));

                const card = document.createElement('div');
                card.className = 'plot-card' + (isCompleted ? ' completed-plot' : '');
                card.innerHTML = `
                    <div class="plot-header">
                        <div class="plot-title">
                            <div class="plot-icon-container">${plot.icon || '🏗️'}</div>
                            <div>
                                <div style="font-size: 1.15rem; font-weight: 700; color: #f8fafc; margin-bottom: 2px;">${plot.name}</div>
                                <div style="font-size: 0.85rem; color: #94a3b8; font-weight: 400;">${plot.description || ''}</div>
                            </div>
                        </div>
                        <span class="plot-badge ${isCompleted ? 'badge-completed' : 'badge-active'}">
                            ${isCompleted ? '✨ ¡Completado / Compartido!' : '⚡ En Financiación Colectiva'}
                        </span>
                    </div>

                    <div style="display: flex; justify-content: space-between; font-size: 0.88rem; color: #94a3b8; margin-top: 14px;">
                        <span>Progreso de financiación</span>
                        <span style="color: #ffffff; font-weight: 600;">${plot.current_constructors} / ${plot.cost_constructors} 🏗️ (${percentage}%)</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${percentage}%;"></div>
                    </div>

                    <div class="plot-footer">
                        <span>Coste objetivo: <b style="color: #f8fafc;">${plot.cost_constructors} 🏗️</b></span>
                        <button class="btn-action" onclick="contributeToPlot(${plot.id})" ${isCompleted ? 'disabled' : ''}>
                            ${isCompleted ? '✨ Proyecto Finalizado' : 'Aportar 1 Constructor (🏗️)'}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function contributeToPlot(plotId) {
            if (!currentUser) {
                alert("Debes iniciar sesión para aportar Constructors.");
                window.location.href = 'login.html';
                return;
            }

            if (userConstructorsBalance < 1) {
                alert("No te quedan Constructors disponibles. Reclama tu recompensa diaria en tu perfil.");
                return;
            }

            const plot = plotsData.find(p => p.id === plotId);
            if (!plot) return;

            const newTotal = (plot.current_constructors || 0) + 1;
            const isCompleted = newTotal >= plot.cost_constructors;
            const newStatus = isCompleted ? 'completed' : 'active';

            try {
                await supabaseClient.from('plot_contributions').insert({
                    user_id: currentUser.id,
                    plot_id: plotId,
                    amount: 1
                });

                await supabaseClient
                    .from('board_plots')
                    .update({
                        current_constructors: newTotal,
                        status: newStatus
                    })
                    .eq('id', plotId);

                const newBalance = userConstructorsBalance - 1;
                await supabaseClient
                    .from('profiles')
                    .update({ constructors: newBalance })
                    .eq('id', currentUser.id);

                userConstructorsBalance = newBalance;
                document.getElementById('panel-user-constructors').textContent = userConstructorsBalance + ' 🏗️';

                alert(isCompleted ? "🎉 ¡Felicidades! Habéis completado este proyecto DAO colectivo." : "✅ ¡Aportación realizada con éxito!");
                loadPlots();

            } catch (err) {
                console.error("Error en aportación:", err);
                alert("Hubo un error al procesar tu aportación.");
            }
        }

        async function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tab-colective').classList.toggle('active', mode === 'colective');
            document.getElementById('tab-individual').classList.toggle('active', mode === 'individual');

            const container = document.getElementById('main-content-area');
            if (mode === 'individual') {
                container.innerHTML = `
                    <div class="buy-property-card">
                        <div style="color: #00ff88; font-weight: 700; margin-bottom: 6px; font-size: 1.1rem;">➕ Comprar Nueva Propiedad Privada</div>
                        <div style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 18px;">Selecciona el tipo de inmueble y adquiérelo por 2 Constructors (🏗️).</div>
                        
                        <div class="type-buttons-grid">
                            <button class="type-btn selected" id="btn-type-house" onclick="selectPropertyType('🏠', 'Casa Residencial', 'btn-type-house')">
                                <span style="font-size: 1.4rem;">🏠</span> Casa
                            </button>
                            <button class="type-btn" id="btn-type-office" onclick="selectPropertyType('🏢', 'Edificio de Oficinas', 'btn-type-office')">
                                <span style="font-size: 1.4rem;">🏢</span> Edificio
                            </button>
                            <button class="type-btn" id="btn-type-shop" onclick="selectPropertyType('🏬', 'Local Comercial', 'btn-type-shop')">
                                <span style="font-size: 1.4rem;">🏬</span> Local
                            </button>
                            <button class="type-btn" id="btn-type-factory" onclick="selectPropertyType('🏭', 'Taller / Fábrica', 'btn-type-factory')">
                                <span style="font-size: 1.4rem;">🏭</span> Taller
                            </button>
                        </div>

                        <input type="text" id="new-prop-name" class="form-input" placeholder="Nombre personalizado (opcional)..." />
                        <button class="btn-action" onclick="buyPrivateProperty()" style="background: linear-gradient(135deg, #00ff88, #00f0ff); color: #0b0f19; width: 100%; padding: 12px; font-size: 0.95rem;">Comprar Propiedad (2 🏗️)</button>
                    </div>

                    <div class="section-title">Mis Inmuebles Registrados</div>
                    <div class="section-desc">Gestiona tus propiedades privadas y sube de nivel invirtiendo más Constructors.</div>
                    <div id="private-list-container">
                        <div style="text-align: center; color: #94a3b8; padding: 30px;">Cargando tus propiedades...</div>
                    </div>
                `;
                loadUserPrivateProperties();
            } else {
                container.innerHTML = `
                    <div class="section-title">Parcelas Urbanas de Amposta</div>
                    <div class="section-desc">Invierte tus Constructors en proyectos comunitarios. Una vez completados, la propiedad es 100% compartida entre todos los inversores del DAO sin un dueño único.</div>
                    <div id="plots-list-container">
                        <div style="text-align: center; color: #94a3b8; padding: 40px;">Cargando inversiones...</div>
                    </div>
                `;
                loadPlots();
            }
        }

        function selectPropertyType(icon, defaultName, buttonId) {
            selectedPropertyIcon = icon;
            selectedPropertyNameDefault = defaultName;
            
            document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById(buttonId).classList.add('selected');
        }

        async function loadUserPrivateProperties() {
            if (!currentUser) return;
            const container = document.getElementById('private-list-container');
            try {
                const { data, error } = await supabaseClient
                    .from('user_properties')
                    .select('*')
                    .eq('user_id', currentUser.id);

                if (!error && data && data.length > 0) {
                    container.innerHTML = '';
                    data.forEach(prop => {
                        const card = document.createElement('div');
                        card.className = 'plot-card completed-plot';
                        card.innerHTML = `
                            <div class="plot-header">
                                <div class="plot-title">
                                    <div class="plot-icon-container">${prop.icon || '🏠'}</div>
                                    <div>
                                        <div style="font-size: 1.15rem; font-weight: 700; color: #f8fafc; margin-bottom: 2px;">${prop.name}</div>
                                        <div style="font-size: 0.85rem; color: #00ff88; font-weight: 600;">Total invertido: ${prop.total_constructors || (prop.level * 2)} 🏗️ Constructors</div>
                                    </div>
                                </div>
                                <span class="plot-badge badge-completed">Nivel ${prop.level || 1}</span>
                            </div>
                            <div style="display: flex; justify-content: flex-end; margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.04); padding-top: 14px;">
                                <button class="btn-action" onclick="upgradeProperty(${prop.id}, ${prop.level || 1}, ${prop.total_constructors || 2})" style="background: linear-gradient(135deg, #00ff88, #00f0ff); color: #0b0f19;">⬆️ Subir de Nivel (+1 🏗️)</button>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 30px; background: rgba(15, 23, 42, 0.4); border-radius: 14px; border: 1px dashed rgba(255,255,255,0.1);">No tienes propiedades privadas registradas todavía. ¡Utiliza los botones superiores para adquirir una!</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 20px;">Error al cargar las propiedades privadas.</div>`;
            }
        }

        async function buyPrivateProperty() {
            if (!currentUser) {
                alert("Debes iniciar sesión.");
                window.location.href = 'login.html';
                return;
            }

            if (userConstructorsBalance < 2) {
                alert("Necesitas al menos 2 Constructors (🏗️) para comprar una propiedad privada.");
                return;
            }

            const nameInput = document.getElementById('new-prop-name').value.trim();
            const propName = nameInput || selectedPropertyNameDefault;

            try {
                const { error: insertErr } = await supabaseClient
                    .from('user_properties')
                    .insert({
                        user_id: currentUser.id,
                        name: propName,
                        icon: selectedPropertyIcon,
                        level: 1,
                        total_constructors: 2
                    });

                if (insertErr) {
                    alert("Error al registrar la propiedad en Supabase.");
                    return;
                }

                const newBalance = userConstructorsBalance - 2;
                await supabaseClient
                    .from('profiles')
                    .update({ constructors: newBalance })
                    .eq('id', currentUser.id);

                userConstructorsBalance = newBalance;
                document.getElementById('panel-user-constructors').textContent = userConstructorsBalance + ' 🏗️';

                alert("🎉 ¡Propiedad privada adquirida con éxito!");
                document.getElementById('new-prop-name').value = '';
                loadUserPrivateProperties();

            } catch (err) {
                console.error("Error comprando propiedad:", err);
                alert("Error al procesar la compra.");
            }
        }

        async function upgradeProperty(propId, currentLevel, currentTotal) {
            if (!currentUser) return;

            if (userConstructorsBalance < 1) {
                alert("No te quedan Constructors disponibles para subir de nivel.");
                return;
            }

            try {
                const newLevel = currentLevel + 1;
                const newTotal = currentTotal + 1;

                const { error: updateErr } = await supabaseClient
                    .from('user_properties')
                    .update({
                        level: newLevel,
                        total_constructors: newTotal
                    })
                    .eq('id', propId);

                if (updateErr) {
                    alert("Error al actualizar la propiedad.");
                    return;
                }

                const newBalance = userConstructorsBalance - 1;
                await supabaseClient
                    .from('profiles')
                    .update({ constructors: newBalance })
                    .eq('id', currentUser.id);

                userConstructorsBalance = newBalance;
                document.getElementById('panel-user-constructors').textContent = userConstructorsBalance + ' 🏗️';

                alert("⭐ ¡Propiedad mejorada al nivel " + newLevel + "!");
                loadUserPrivateProperties();

            } catch (err) {
                console.error("Error mejorando propiedad:", err);
                alert("Hubo un error al subir de nivel.");
            }
        }
    </script>
</body>
</html>
