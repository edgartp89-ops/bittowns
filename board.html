<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Amposta - Bit-Towns</title>
    <link rel="icon" type="image/png" href="favicon.png?v=1">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1 {
            font-size: 1.3rem;
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        .nav-links {
            display: flex;
            gap: 10px;
        }
        .btn-nav {
            color: #00f0ff;
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(0, 240, 255, 0.05);
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-nav:hover {
            background: rgba(0, 240, 255, 0.2);
        }
        .btn-profile {
            color: #ffb703;
            border-color: rgba(255, 183, 3, 0.4);
            background: rgba(255, 183, 3, 0.08);
        }
        .btn-profile:hover {
            background: rgba(255, 183, 3, 0.25);
        }

        .tabs-bar {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 20px;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 999;
        }
        .tab-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a0aec0;
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: rgba(0, 240, 255, 0.15);
            border-color: #00f0ff;
            color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .main-container {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #map {
            flex: 1;
            height: 100%;
            background: #0b0f19;
        }

        /* Panel lateral con listado de propiedades y progreso */
        .side-panel {
            width: 400px;
            background: rgba(11, 15, 25, 0.96);
            border-left: 1px solid rgba(0, 240, 255, 0.2);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-sizing: border-box;
            padding: 20px;
            overflow-y: auto;
        }
        .panel-title {
            color: #00f0ff;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-desc {
            color: #a0aec0;
            font-size: 0.8rem;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .user-constructors-box {
            background: rgba(255, 183, 3, 0.08);
            border: 1px solid rgba(255, 183, 3, 0.3);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Tarjeta de cada propiedad en el listado lateral */
        .plot-list-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .plot-list-item:hover {
            background: rgba(0, 240, 255, 0.08);
            border-color: #00f0ff;
            transform: translateX(2px);
        }
        .plot-list-item.selected {
            background: rgba(0, 240, 255, 0.12);
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        .plot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .plot-title-text {
            font-weight: bold;
            color: #ffffff;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .plot-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: bold;
        }
        .badge-active { background: rgba(0, 240, 255, 0.15); color: #00f0ff; border: 1px solid rgba(0, 240, 255, 0.3); }
        .badge-completed { background: rgba(0, 255, 136, 0.15); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.3); }

        .progress-bar-bg {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            margin: 8px 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .plot-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #a0aec0;
            margin-top: 6px;
        }

        .btn-action-small {
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            color: #ffffff;
            border: none;
            padding: 5px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-action-small:hover:not(:disabled) {
            transform: scale(1.05);
        }
        .btn-action-small:disabled {
            background: rgba(255, 255, 255, 0.08);
            color: #718096;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <span style="font-size: 1.5rem;">🎲</span>
            <h1>Tablero Phygital — Amposta</h1>
        </div>
        <div class="nav-links">
            <a href="profile.html" class="btn-profile">👤 Mi Perfil</a>
            <a href="index.html" class="btn-nav">🏠 Inicio</a>
        </div>
    </div>

    <!-- Pestañas de modo -->
    <div class="tabs-bar">
        <button class="tab-btn active" id="tab-colective" onclick="switchTab('colective')">🏛️ Mapa Colectivo (DAO)</button>
        <button class="tab-btn" id="tab-individual" onclick="switchTab('individual')">🏡 Mis Propiedades Privadas</button>
    </div>

    <div class="main-container">
        <!-- Mapa OpenStreetMap / Leaflet -->
        <div id="map"></div>

        <!-- Panel Lateral con Listado y Progreso -->
        <div class="side-panel" id="side-panel-content">
            <h2 class="panel-title">🏛️ Listado de Inversiones DAO</h2>
            <p class="panel-desc">Explora las parcelas comunitarias de Amposta, revisa su progreso e invierte tus Constructors.</p>
            
            <div class="user-constructors-box">
                <span style="color: #ffb703; font-weight: bold; font-size: 0.85rem;">Tus Constructors Disponibles:</span>
                <span id="panel-user-constructors" style="color: #ffb703; font-weight: bold; font-size: 1.05rem;">0 🏗️</span>
            </div>

            <div id="plots-list-container">
                <div style="text-align: center; color: #a0aec0; padding: 20px; font-size: 0.85rem;">
                    Cargando parcelas de Amposta...
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cxpsktskbvrkwtkolrpl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4cHNrdHNrYnZya3d0a29scnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTc1MjUsImV4cCI6MjEwNzAzMzUyNX0.9RJAEUxalZ3oI9DVWDr8x9s4QPpxWXZwMQBRm9lwVq0';

        let supabaseClient;
        let map;
        let currentMode = 'colective';
        let currentUser = null;
        let userConstructorsBalance = 0;
        let markersLayer = L.layerGroup();
        let plotsData = [];
        let selectedPlotId = null;

        const DEFAULT_AMPOSTA_PLOTS = [
            { id: 1, name: "Plaça del Ajuntament", description: "Centro neurálgico y administrativo de Amposta.", lat: 40.7078, lng: 0.5825, icon: "🏛️", cost_constructors: 10, current_constructors: 0, status: "active" },
            { id: 2, name: "Pont Colgant d'Amposta", description: "Icónico puente colgante sobre el río Ebro.", lat: 40.7102, lng: 0.5840, icon: "🌉", cost_constructors: 15, current_constructors: 0, status: "active" },
            { id: 3, name: "Passeig del Canal", description: "Zona verde y recreativa junto al canal de riego.", lat: 40.7050, lng: 0.5790, icon: "🌳", cost_constructors: 8, current_constructors: 0, status: "active" },
            { id: 4, name: "Zona Comercial del Centre", description: "Eje de comercios locales y tiendas de proximidad.", lat: 40.7085, lng: 0.5805, icon: "🏬", cost_constructors: 12, current_constructors: 0, status: "active" },
            { id: 5, name: "Torre de la Carrova", description: "Torre medieval defensiva a orillas del Ebro.", lat: 40.7250, lng: 0.5920, icon: "🏰", cost_constructors: 20, current_constructors: 0, status: "active" }
        ];

        window.addEventListener('DOMContentLoaded', async () => {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                fetchUserProfile(currentUser.id);
            }

            initMap();
            loadPlots();

            const urlParams = new URLSearchParams(window.location.search);
            const targetPlotId = urlParams.get('plot');
            const targetTab = urlParams.get('tab');

            if (targetTab === 'individual') {
                switchTab('individual');
            } else if (targetPlotId) {
                setTimeout(() => {
                    selectPlotById(parseInt(targetPlotId));
                }, 800);
            }
        });

        function initMap() {
            map = L.map('map').setView([40.7088, 0.5822], 15);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            markersLayer.addTo(map);
        }

        async function fetchUserProfile(userId) {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('constructors')
                    .eq('id', userId)
                    .single();
                
                if (!error && data) {
                    userConstructorsBalance = data.constructors || 0;
                    const el = document.getElementById('panel-user-constructors');
                    if (el) el.textContent = userConstructorsBalance + ' 🏗️';
                }
            } catch (err) {
                console.error("Error al cargar perfil:", err);
            }
        }

        async function loadPlots() {
            markersLayer.clearLayers();
            try {
                const { data, error } = await supabaseClient
                    .from('board_plots')
                    .select('*');

                if (error || !data || data.length === 0) {
                    plotsData = DEFAULT_AMPOSTA_PLOTS;
                } else {
                    plotsData = data;
                }
                renderMarkers();
                renderPlotsList();
            } catch (err) {
                plotsData = DEFAULT_AMPOSTA_PLOTS;
                renderMarkers();
                renderPlotsList();
            }
        }

        function renderMarkers() {
            markersLayer.clearLayers();

            plotsData.forEach(plot => {
                const isCompleted = plot.status === 'completed' || plot.current_constructors >= plot.cost_constructors;
                const markerColor = isCompleted ? '#00ff88' : '#00f0ff';

                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div style="background-color: #0b0f19; border: 2px solid ${markerColor}; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 1rem; box-shadow: 0 0 10px ${markerColor};">${plot.icon || '🏗️'}</div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                const marker = L.marker([plot.lat, plot.lng], { icon: customIcon });
                marker.on('click', () => {
                    selectPlotById(plot.id);
                });

                markersLayer.addLayer(marker);
            });
        }

        function renderPlotsList() {
            const container = document.getElementById('plots-list-container');
            if (!container) return;

            container.innerHTML = '';
            plotsData.forEach(plot => {
                const isCompleted = plot.status === 'completed' || plot.current_constructors >= plot.cost_constructors;
                const percentage = Math.min(100, Math.round((plot.current_constructors / plot.cost_constructors) * 100));
                const isSelected = selectedPlotId === plot.id;

                const item = document.createElement('div');
                item.className = 'plot-list-item' + (isSelected ? ' selected' : '');
                item.onclick = () => selectPlotById(plot.id);

                item.innerHTML = `
                    <div class="plot-header">
                        <span class="plot-title-text">${plot.icon || '🏗️'} ${plot.name}</span>
                        <span class="plot-badge ${isCompleted ? 'badge-completed' : 'badge-active'}">
                            ${isCompleted ? '✨ Completado' : '⚡ Activo'}
                        </span>
                    </div>
                    <div style="font-size: 0.75rem; color: #a0aec0; margin-bottom: 6px;">${plot.description || ''}</div>
                    
                    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #a0aec0;">
                        <span>Progreso: ${plot.current_constructors} / ${plot.cost_constructors} 🏗️</span>
                        <span style="color: #ffffff; font-weight: bold;">${percentage}%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${percentage}%;"></div>
                    </div>

                    <div class="plot-footer">
                        <span>Coste total: ${plot.cost_constructors} 🏗️</span>
                        <button class="btn-action-small" onclick="event.stopPropagation(); contributeToPlot(${plot.id})" ${isCompleted ? 'disabled' : ''}>
                            ${isCompleted ? 'Financiado' : '+1 🏗️ Aportar'}
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function selectPlotById(id) {
            selectedPlotId = id;
            const plot = plotsData.find(p => p.id === id);
            if (plot) {
                map.setView([plot.lat, plot.lng], 17);
                renderPlotsList();
            }
        }

        async function contributeToPlot(plotId) {
            if (!currentUser) {
                alert("Debes iniciar sesión para aportar Constructors.");
                window.location.href = 'login.html';
                return;
            }

            if (userConstructorsBalance < 1) {
                alert("No te quedan Constructors disponibles. Reclama tu recompensa diaria en tu perfil.");
                return;
            }

            const plot = plotsData.find(p => p.id === plotId);
            if (!plot) return;

            const newTotal = (plot.current_constructors || 0) + 1;
            const isCompleted = newTotal >= plot.cost_constructors;
            const newStatus = isCompleted ? 'completed' : 'active';

            try {
                await supabaseClient.from('plot_contributions').insert({
                    user_id: currentUser.id,
                    plot_id: plotId,
                    amount: 1
                });

                // Actualiza parcela sin asignar owner_id individual (DAO 100% compartido)
                await supabaseClient
                    .from('board_plots')
                    .update({
                        current_constructors: newTotal,
                        status: newStatus
                    })
                    .eq('id', plotId);

                const newBalance = userConstructorsBalance - 1;
                await supabaseClient
                    .from('profiles')
                    .update({ constructors: newBalance })
                    .eq('id', currentUser.id);

                userConstructorsBalance = newBalance;
                document.getElementById('panel-user-constructors').textContent = userConstructorsBalance + ' 🏗️';

                alert(isCompleted ? "🎉 ¡Felicidades! Habéis completado este proyecto DAO colectivo." : "✅ ¡Aportación realizada con éxito!");
                
                await loadPlots();

            } catch (err) {
                console.error("Error en aportación:", err);
                alert("Hubo un error al procesar tu aportación.");
            }
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tab-colective').classList.toggle('active', mode === 'colective');
            document.getElementById('tab-individual').classList.toggle('active', mode === 'individual');

            const panel = document.getElementById('side-panel-content');
            if (mode === 'individual') {
                panel.innerHTML = `
                    <h2 class="panel-title">🏡 Mis Propiedades Privadas</h2>
                    <p class="panel-desc">Tus viviendas y locales personales en el ecosistema Phygital de Amposta.</p>
                    <div id="private-list-container" style="color: #a0aec0; font-size: 0.85rem; text-align: center; padding: 20px;">
                        Cargando tus propiedades...
                    </div>
                `;
                loadUserPrivatePropertiesList();
            } else {
                panel.innerHTML = `
                    <h2 class="panel-title">🏛️ Listado de Inversiones DAO</h2>
                    <p class="panel-desc">Explora las parcelas comunitarias de Amposta, revisa su progreso e invierte tus Constructors.</p>
                    <div class="user-constructors-box">
                        <span style="color: #ffb703; font-weight: bold; font-size: 0.85rem;">Tus Constructors Disponibles:</span>
                        <span id="panel-user-constructors" style="color: #ffb703; font-weight: bold; font-size: 1.05rem;">${userConstructorsBalance} 🏗️</span>
                    </div>
                    <div id="plots-list-container">
                        <div style="text-align: center; color: #a0aec0; padding: 20px; font-size: 0.85rem;">
                            Cargando parcelas de Amposta...
                        </div>
                    </div>
                `;
                loadPlots();
            }
        }

        async function loadUserPrivatePropertiesList() {
            if (!currentUser) return;
            const container = document.getElementById('private-list-container');
            try {
                const { data, error } = await supabaseClient
                    .from('user_properties')
                    .select('*')
                    .eq('user_id', currentUser.id);

                if (!error && data && data.length > 0) {
                    container.innerHTML = '';
                    data.forEach(prop => {
                        const div = document.createElement('div');
                        div.style.background = 'rgba(0, 255, 136, 0.05)';
                        div.style.border = '1px solid rgba(0, 255, 136, 0.3)';
                        div.style.padding = '12px';
                        div.style.borderRadius = '10px';
                        div.style.marginBottom = '10px';
                        div.innerHTML = `
                            <div style="font-weight: bold; color: #ffffff; display: flex; align-items: center; gap: 8px;">
                                <span>${prop.icon || '🏠'}</span>
                                <span>${prop.name}</span>
                            </div>
                            <div style="color: #00ff88; font-size: 0.8rem; margin-top: 6px;">Nivel ${prop.level} (${prop.total_constructors || prop.level} 🏗️ invertidos)</div>
                        `;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = `<div style="text-align: center; color: #a0aec0; padding: 15px;">No tienes propiedades privadas registradas todavía.</div>`;
                }
            } catch (err) {
                console.error("Error cargando propiedades privadas:", err);
            }
        }
    </script>
</body>
</html>
