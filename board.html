<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Inversiones - Bit-Towns</title>
    <link rel="icon" type="image/png" href="favicon.png?v=1">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1 {
            font-size: 1.4rem;
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        .nav-links {
            display: flex;
            gap: 10px;
        }
        .btn-nav {
            color: #00f0ff;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(0, 240, 255, 0.05);
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-nav:hover {
            background: rgba(0, 240, 255, 0.2);
        }
        .btn-profile {
            color: #ffb703;
            border-color: rgba(255, 183, 3, 0.4);
            background: rgba(255, 183, 3, 0.08);
        }
        .btn-profile:hover {
            background: rgba(255, 183, 3, 0.25);
        }

        .tabs-bar {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 30px;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tab-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a0aec0;
            padding: 8px 18px;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: rgba(0, 240, 255, 0.15);
            border-color: #00f0ff;
            color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            box-sizing: border-box;
            flex: 1;
        }

        .user-constructors-box {
            background: rgba(255, 183, 3, 0.08);
            border: 1px solid rgba(255, 183, 3, 0.3);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            color: #00f0ff;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .section-desc {
            color: #a0aec0;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .plot-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }
        .plot-card:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }
        .plot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .plot-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .plot-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: bold;
        }
        .badge-active { background: rgba(0, 240, 255, 0.15); color: #00f0ff; border: 1px solid rgba(0, 240, 255, 0.3); }
        .badge-completed { background: rgba(0, 255, 136, 0.15); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.3); }

        .progress-bar-bg {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            height: 10px;
            overflow: hidden;
            margin: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .plot-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 0.85rem;
            color: #a0aec0;
        }

        .btn-action {
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }
        .btn-action:hover:not(:disabled) {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }
        .btn-action:disabled {
            background: rgba(255, 255, 255, 0.08);
            color: #718096;
            cursor: not-allowed;
            box-shadow: none;
        }

        .buy-property-card {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.3);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 25px;
        }
        .form-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 136, 0.4);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
        }
        .form-input:focus {
            border-color: #00ff88;
        }

        /* Botones de selección de tipo de propiedad */
        .type-buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .type-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .type-btn:hover {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.08);
        }
        .type-btn.selected {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <span style="font-size: 1.6rem;">🏛️</span>
            <h1>Tablero de Inversiones - Bit-Towns</h1>
        </div>
        <div class="nav-links">
            <a href="profile.html" class="btn-profile">👤 Mi Perfil</a>
            <a href="index.html" class="btn-nav">🏠 Inicio</a>
        </div>
    </div>

    <!-- Pestañas -->
    <div class="tabs-bar">
        <button class="tab-btn active" id="tab-colective" onclick="switchTab('colective')">🏛️ Inversiones Colectivas DAO</button>
        <button class="tab-btn" id="tab-individual" onclick="switchTab('individual')">🏡 Mis Propiedades Privadas</button>
    </div>

    <div class="container">
        <div class="user-constructors-box">
            <span style="color: #ffb703; font-weight: bold; font-size: 0.95rem;">Tus Constructors Disponibles:</span>
            <span id="panel-user-constructors" style="color: #ffb703; font-weight: bold; font-size: 1.2rem;">0 🏗️</span>
        </div>

        <div id="main-content-area">
            <!-- Contenido dinámico -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cxpsktskbvrkwtkolrpl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4cHNrdHNrYnZya3d0a29scnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTc1MjUsImV4cCI6MjEwNzAzMzUyNX0.9RJAEUxalZ3oI9DVWDr8x9s4QPpxWXZwMQBRm9lwVq0';

        let supabaseClient;
        let currentUser = null;
        let userConstructorsBalance = 0;
        let currentMode = 'colective';
        let plotsData = [];
        let selectedPropertyIcon = '🏠';
        let selectedPropertyNameDefault = 'Casa Residencial';

        const DEFAULT_AMPOSTA_PLOTS = [
            { id: 1, name: "Plaça del Ajuntament", description: "Centro neurálgico y administrativo de Amposta.", icon: "🏛️", cost_constructors: 10, current_constructors: 0, status: "active" },
            { id: 2, name: "Pont Colgant d'Amposta", description: "Icónico puente colgante sobre el río Ebro.", icon: "🌉", cost_constructors: 15, current_constructors: 0, status: "active" },
            { id: 3, name: "Passeig del Canal", description: "Zona verde y recreativa junto al canal de riego.", icon: "🌳", cost_constructors: 8, current_constructors: 0, status: "active" },
            { id: 4, name: "Zona Comercial del Centre", description: "Eje de comercios locales y tiendas de proximidad.", icon: "🏬", cost_constructors: 12, current_constructors: 0, status: "active" },
            { id: 5, name: "Torre de la Carrova", description: "Torre medieval defensiva a orillas del Ebro.", icon: "🏰", cost_constructors: 20, current_constructors: 0, status: "active" }
        ];

        window.addEventListener('DOMContentLoaded', async () => {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                await fetchUserProfile(currentUser.id);
            }

            switchTab('colective');
        });

        async function fetchUserProfile(userId) {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('constructors')
                    .eq('id', userId)
                    .single();
                
                if (!error && data) {
                    userConstructorsBalance = data.constructors || 0;
                    const el = document.getElementById('panel-user-constructors');
                    if (el) el.textContent = userConstructorsBalance + ' 🏗️';
                }
            } catch (err) {
                console.error("Error al cargar perfil:", err);
            }
        }

        async function loadPlots() {
            try {
                const { data, error } = await supabaseClient
                    .from('board_plots')
                    .select('*');

                if (error || !data || data.length === 0) {
                    plotsData = DEFAULT_AMPOSTA_PLOTS;
                } else {
                    plotsData = data;
                }
                renderPlotsList();
            } catch (err) {
                plotsData = DEFAULT_AMPOSTA_PLOTS;
                renderPlotsList();
            }
        }

        function renderPlotsList() {
            const container = document.getElementById('plots-list-container');
            if (!container) return;

            container.innerHTML = '';
            plotsData.forEach(plot => {
                const isCompleted = plot.status === 'completed' || plot.current_constructors >= plot.cost_constructors;
                const percentage = Math.min(100, Math.round((plot.current_constructors / plot.cost_constructors) * 100));

                const card = document.createElement('div');
                card.className = 'plot-card';
                card.innerHTML = `
                    <div class="plot-header">
                        <div class="plot-title">
                            <span style="font-size: 1.3rem;">${plot.icon || '🏗️'}</span>
                            <span>${plot.name}</span>
                        </div>
                        <span class="plot-badge ${isCompleted ? 'badge-completed' : 'badge-active'}">
                            ${isCompleted ? '✨ Propiedad Compartida (DAO)' : '⚡ En Financiación Colectiva'}
                        </span>
                    </div>
                    <div style="color: #a0aec0; font-size: 0.85rem; margin-bottom: 10px;">${plot.description || ''}</div>
                    
                    <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: #a0aec0;">
                        <span>Progreso de financiación</span>
                        <span style="color: #ffffff; font-weight: bold;">${plot.current_constructors} / ${plot.cost_constructors} 🏗️ (${percentage}%)</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${percentage}%;"></div>
                    </div>

                    <div class="plot-footer">
                        <span>Coste objetivo: <b>${plot.cost_constructors} 🏗️</b></span>
                        <button class="btn-action" onclick="contributeToPlot(${plot.id})" ${isCompleted ? 'disabled' : ''}>
                            ${isCompleted ? 'Proyecto Completado' : 'Aportar 1 Constructor (🏗️)'}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function contributeToPlot(plotId) {
            if (!currentUser) {
                alert("Debes iniciar sesión para aportar Constructors.");
                window.location.href = 'login.html';
                return;
            }

            if (userConstructorsBalance < 1) {
                alert("No te quedan Constructors disponibles. Reclama tu recompensa diaria en tu perfil.");
                return;
            }

            const plot = plotsData.find(p => p.id === plotId);
            if (!plot) return;

            const newTotal = (plot.current_constructors || 0) + 1;
            const isCompleted = newTotal >= plot.cost_constructors;
            const newStatus = isCompleted ? 'completed' : 'active';

            try {
                await supabaseClient.from('plot_contributions').insert({
                    user_id: currentUser.id,
                    plot_id: plotId,
                    amount: 1
                });

                await supabaseClient
                    .from('board_plots')
                    .update({
                        current_constructors: newTotal,
                        status: newStatus
                    })
                    .eq('id', plotId);

                const newBalance = userConstructorsBalance - 1;
                await supabaseClient
                    .from('profiles')
                    .update({ constructors: newBalance })
                    .eq('id', currentUser.id);

                userConstructorsBalance = newBalance;
                document.getElementById('panel-user-constructors').textContent = userConstructorsBalance + ' 🏗️';

                alert(isCompleted ? "🎉 ¡Felicidades! Habéis completado este proyecto DAO colectivo." : "✅ ¡Aportación realizada con éxito!");
                loadPlots();

            } catch (err) {
                console.error("Error en aportación:", err);
                alert("Hubo un error al procesar tu aportación.");
            }
        }

        async function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tab-colective').classList.toggle('active', mode === 'colective');
            document.getElementById('tab-individual').classList.toggle('active', mode === 'individual');

            const container = document.getElementById('main-content-area');
            if (mode === 'individual') {
                container.innerHTML = `
                    <div class="buy-property-card">
                        <div style="color: #00ff88; font-weight: bold; margin-bottom: 6px; font-size: 1.05rem;">➕ Comprar Nueva Propiedad Privada</div>
                        <div style="color: #a0aec0; font-size: 0.85rem; margin-bottom: 15px;">Selecciona el tipo de inmueble y adquiérelo por 2 Constructors (🏗️).</div>
                        
                        <div class="type-buttons-grid">
                            <button class="type-btn selected" id="btn-type-house" onclick="selectPropertyType('🏠', 'Casa Residencial', 'btn-type-house')">🏠 Casa</button>
                            <button class="type-btn" id="btn-type-office" onclick="selectPropertyType('🏢', 'Edificio de Oficinas', 'btn-type-office')">🏢 Edificio</button>
                            <button class="type-btn" id="btn-type-shop" onclick="selectPropertyType('🏬', 'Local Comercial', 'btn-type-shop')">🏬 Local</button>
                            <button class="type-btn" id="btn-type-factory" onclick="selectPropertyType('🏭', 'Taller / Fábrica', 'btn-type-factory')">🏭 Taller</button>
                        </div>

                        <input type="text" id="new-prop-name" class="form-input" placeholder="Nombre personalizado (opcional)..." />
                        <button class="btn-action" onclick="buyPrivateProperty()" style="background: linear-gradient(90deg, #00ff88, #00f0ff); color: #0b0f19; width: 100%; padding: 10px;">Comprar Propiedad (2 🏗️)</button>
                    </div>

                    <div class="section-title">Mis Inmuebles Registrados</div>
                    <div class="section-desc">Gestiona tus propiedades privadas y sube de nivel invirtiendo más Constructors.</div>
                    <div id="private-list-container">
                        <div style="text-align: center; color: #a0aec0; padding: 20px;">Cargando tus propiedades...</div>
                    </div>
                `;
                loadUserPrivateProperties();
            } else {
                container.innerHTML = `
                    <div class="section-title">Parcelas Urbanas de Amposta</div>
                    <div class="section-desc">Invierte tus Constructors en proyectos comunitarios. Una vez completados, la propiedad es 100% compartida entre todos los inversores del DAO sin un dueño único.</div>
                    <div id="plots-list-container">
                        <div style="text-align: center; color: #a0aec0; padding: 30px;">Cargando inversiones...</div>
                    </div>
                `;
                loadPlots();
            }
        }

        function selectPropertyType(icon, defaultName, buttonId) {
            selectedPropertyIcon = icon;
            selectedPropertyNameDefault = defaultName;
            
            // Quitar clase selected a todos y ponérsela al pulsado
            document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById(buttonId).classList.add('selected');
        }

        async function loadUserPrivateProperties() {
            if (!currentUser) return;
            const container = document.getElementById('private-list-container');
            try {
                const { data, error } = await supabaseClient
                    .from('user_properties')
                    .select('*')
                    .eq('user_id', currentUser.id);

                if (!error && data && data.length > 0) {
                    container.innerHTML = '';
                    data.forEach(prop => {
                        const card = document.createElement('div');
                        card.className = 'plot-card';
                        card.innerHTML = `
                            <div class="plot-header">
                                <div class="plot-title">
                                    <span>${prop.icon || '🏠'}</span>
                                    <span>${prop.name}</span>
                                </div>
                                <span class="plot-badge badge-completed">Nivel ${prop.level || 1}</span>
                            </div>
                            <div style="color: #00ff88; font-size: 0.85rem; margin-bottom: 12px;">Total invertido: ${prop.total_constructors || (prop.level * 2)} 🏗️ Constructors</div>
                            <div style="display: flex; justify-content: flex-end;">
                                <button class="btn-action" onclick="upgradeProperty(${prop.id}, ${prop.level || 1}, ${prop.total_constructors || 2})">⬆️ Subir de Nivel (+1 🏗️)</button>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<div style="text-align: center; color: #a0aec0; padding: 20px;">No tienes propiedades privadas registradas todavía. ¡Utiliza los botones superiores para adquirir una!</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div style="text-align: center; color: #a0aec0; padding: 20px;">Error al cargar las propiedades privadas.</div>`;
            }
        }

        async function buyPrivateProperty() {
            if (!currentUser) {
                alert("Debes iniciar sesión.");
                window.location.href = 'login.html';
                return;
            }

            if (userConstructorsBalance < 2) {
                alert("Necesitas al menos 2 Constructors (🏗️) para comprar una propiedad privada.");
                return;
            }

            const nameInput = document.getElementById('new-prop-name').value.trim();
            const propName = nameInput || selectedPropertyNameDefault;

            try {
                const { error: insertErr } = await supabaseClient
                    .from('user_properties')
                    .insert({
                        user_id: currentUser.id,
                        name: propName,
                        icon: selectedPropertyIcon,
                        level: 1,
                        total_constructors: 2
                    });

                if (insertErr) {
                    alert("Error al registrar la propiedad en Supabase.");
                    return;
                }

                const newBalance = userConstructorsBalance - 2;
                await supabaseClient
                    .from('profiles')
                    .update({ constructors: newBalance })
                    .eq('id', currentUser.id);

                userConstructorsBalance = newBalance;
                document.getElementById('panel-user-constructors').textContent = userConstructorsBalance + ' 🏗️';

                alert("🎉 ¡Propiedad privada adquirida con éxito!");
                document.getElementById('new-prop-name').value = '';
                loadUserPrivateProperties();

            } catch (err) {
                console.error("Error comprando propiedad:", err);
                alert("Error al procesar la compra.");
            }
        }

        async function upgradeProperty(propId, currentLevel, currentTotal) {
            if (!currentUser) return;

            if (userConstructorsBalance < 1) {
                alert("No te quedan Constructors disponibles para subir de nivel.");
                return;
            }

            try {
                const newLevel = currentLevel + 1;
                const newTotal = currentTotal + 1;

                const { error: updateErr } = await supabaseClient
                    .from('user_properties')
                    .update({
                        level: newLevel,
                        total_constructors: newTotal
                    })
                    .eq('id', propId);

                if (updateErr) {
                    alert("Error al actualizar la propiedad.");
                    return;
                }

                const newBalance = userConstructorsBalance - 1;
                await supabaseClient
                    .from('profiles')
                    .update({ constructors: newBalance })
                    .eq('id', currentUser.id);

                userConstructorsBalance = newBalance;
                document.getElementById('panel-user-constructors').textContent = userConstructorsBalance + ' 🏗️';

                alert("⭐ ¡Propiedad mejorada al nivel " + newLevel + "!");
                loadUserPrivateProperties();

            } catch (err) {
                console.error("Error mejorando propiedad:", err);
                alert("Hubo un error al subir de nivel.");
            }
        }
    </script>
</body>
</html>
