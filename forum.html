<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro Comunitario — Bit-Towns</title>
    <link rel="icon" type="image/png" href="favicon.png?v=1">
    <style>
        :root {
            --bg-base: #070913;
            --bg-surface: #0e1326;
            --bg-card: rgba(16, 22, 40, 0.85);
            --border-subtle: rgba(0, 240, 255, 0.12);
            --border-active: rgba(0, 240, 255, 0.35);
            --accent-cyan: #00f0ff;
            --accent-emerald: #00ff88;
            --accent-purple: #9d4edd;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Profesional */
        .header {
            background: rgba(7, 9, 19, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header-icon {
            font-size: 1.6rem;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4));
        }
        h1 {
            font-size: 1.35rem;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .nav-links {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn-nav {
            color: var(--accent-cyan);
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid var(--border-subtle);
            padding: 7px 16px;
            border-radius: 20px;
            background: rgba(0, 240, 255, 0.03);
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-nav:hover {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--border-active);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
        }
        .btn-profile {
            color: #ffb703;
            border-color: rgba(255, 183, 3, 0.3);
            background: rgba(255, 183, 3, 0.05);
            text-decoration: none;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Contenedor Principal */
        .container {
            max-width: 1000px;
            width: 100%;
            margin: 40px auto;
            padding: 0 24px;
            box-sizing: border-box;
            flex: 1;
        }

        .section-title {
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.2px;
        }
        .section-desc {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 24px;
        }

        /* Tarjeta de Creación de Contenido */
        .forum-post-card {
            background: linear-gradient(145deg, rgba(14, 19, 38, 0.95), rgba(7, 9, 19, 0.95));
            border: 1px solid rgba(0, 255, 136, 0.2);
            padding: 28px;
            border-radius: 16px;
            margin-bottom: 36px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(4, 6, 12, 0.6);
            border: 1px solid rgba(0, 255, 136, 0.25);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.9rem;
            margin-bottom: 14px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
        }
        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-input:focus, .form-textarea:focus {
            border-color: var(--accent-emerald);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
        }

        .btn-action {
            background: linear-gradient(135deg, var(--accent-emerald), var(--accent-cyan));
            color: #070913;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.25);
        }
        .btn-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }

        /* Estilo de la Fila de Tema en el Listado General */
        .thread-item-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }
        @media (max-width: 768px) {
            .thread-item-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
        .thread-item-card:hover {
            border-color: var(--border-active);
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(0, 240, 255, 0.1);
        }
        .thread-main-info {
            flex: 1;
        }
        .thread-title-link {
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 700;
            text-decoration: none;
            display: block;
            margin-bottom: 6px;
            letter-spacing: -0.2px;
            transition: color 0.15s;
        }
        .thread-title-link:hover {
            color: var(--accent-cyan);
        }
        .thread-snippet {
            color: var(--text-muted);
            font-size: 0.88rem;
            line-height: 1.4;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .thread-meta-row {
            display: flex;
            gap: 16px;
            font-size: 0.78rem;
            color: var(--text-dim);
            flex-wrap: wrap;
        }
        .thread-meta-row b {
            color: var(--text-muted);
        }
        .badge-replies {
            background: rgba(0, 240, 255, 0.08);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 240, 255, 0.25);
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 600;
        }
        .thread-action-col {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            min-width: 140px;
        }
        @media (max-width: 768px) {
            .thread-action-col {
                width: 100%;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                border-top: 1px solid rgba(255,255,255,0.04);
                padding-top: 10px;
            }
        }

        /* Estructura para la vista detallada (dentro de un hilo) */
        .post-box {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 220px 1fr;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }
        @media (max-width: 768px) {
            .post-box { grid-template-columns: 1fr; }
        }
        .user-panel {
            background: rgba(5, 7, 15, 0.95);
            border-right: 1px solid var(--border-subtle);
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
        }
        @media (max-width: 768px) {
            .user-panel {
                border-right: none;
                border-bottom: 1px solid var(--border-subtle);
                flex-direction: row;
                justify-content: flex-start;
                gap: 16px;
                text-align: left;
                padding: 16px 20px;
            }
        }
        .user-avatar {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(157, 78, 221, 0.2));
            border: 1px solid var(--border-active);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-bottom: 12px;
        }
        @media (max-width: 768px) {
            .user-avatar { width: 44px; height: 44px; font-size: 1.1rem; margin-bottom: 0; }
        }
        .user-name { color: #ffffff; font-weight: 700; font-size: 0.92rem; word-break: break-all; margin-bottom: 6px; }
        .user-badge {
            background: rgba(0, 240, 255, 0.08);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 240, 255, 0.25);
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .user-badge.admin {
            background: rgba(255, 183, 3, 0.1);
            color: #ffb703;
            border-color: rgba(255, 183, 3, 0.3);
        }
        .user-stats { font-size: 0.78rem; color: var(--text-dim); line-height: 1.4; }
        .user-stats b { color: var(--text-muted); }

        .content-panel {
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .post-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: var(--text-dim);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }
        .post-text { color: #cbd5e1; font-size: 0.92rem; line-height: 1.6; white-space: pre-wrap; margin-bottom: 18px; }
        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .btn-delete {
            background: rgba(255, 75, 75, 0.08);
            color: #ff6b6b;
            border: 1px solid rgba(255, 75, 75, 0.25);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background: rgba(255, 75, 75, 0.2);
            border-color: rgba(255, 75, 75, 0.4);
        }
        .btn-view {
            background: rgba(0, 240, 255, 0.08);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 240, 255, 0.25);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-view:hover {
            background: rgba(0, 240, 255, 0.18);
            border-color: var(--accent-cyan);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-cyan);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .back-link:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <span class="header-icon">💬</span>
            <h1>Foro Comunitario — Bit-Towns</h1>
        </div>
        <div class="nav-links">
            <a href="board.html" class="btn-nav">🏛️ Tablero</a>
            <a href="profile.html" class="btn-profile">👤 Mi Perfil</a>
            <a href="index.html" class="btn-nav">🏠 Inicio</a>
        </div>
    </div>

    <div class="container" id="main-container">
        <div style="text-align: center; color: var(--text-muted); padding: 40px;">Cargando foro institucional...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cxpsktskbvrkwtkolrpl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4cHNrdHNrYnZya3d0a29scnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTc1MjUsImV4cCI6MjEwNzAzMzUyNX0.9RJAEUxalZ3oI9DVWDr8x9s4QPpxWXZwMQBRm9lwVq0';

        let supabaseClient;
        let currentUser = null;
        const ADMIN_EMAIL = 'edgartp89@gmail.com'; 
        let userMessageCounts = {};
        let threadReplyCounts = {};

        window.addEventListener('DOMContentLoaded', async () => {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                alert("Debes iniciar sesión para acceder al foro.");
                window.location.href = 'login.html';
                return;
            }

            currentUser = session.user;
            await loadForumStats();

            const urlParams = new URLSearchParams(window.location.search);
            const threadId = urlParams.get('id');

            if (threadId) {
                loadThreadDetail(threadId);
            } else {
                loadThreadsList();
            }
        });

        async function loadForumStats() {
            try {
                // Cargar recuento de mensajes por usuario y recuento de respuestas por hilo
                const { data: threads } = await supabaseClient.from('forum_threads').select('user_id');
                const { data: replies } = await supabaseClient.from('forum_replies').select('user_id, thread_id');

                userMessageCounts = {};
                threadReplyCounts = {};

                if (threads) {
                    threads.forEach(t => {
                        if (t.user_id) userMessageCounts[t.user_id] = (userMessageCounts[t.user_id] || 0) + 1;
                    });
                }
                if (replies) {
                    replies.forEach(r => {
                        if (r.user_id) userMessageCounts[r.user_id] = (userMessageCounts[r.user_id] || 0) + 1;
                        if (r.thread_id) {
                            threadReplyCounts[r.thread_id] = (threadReplyCounts[r.thread_id] || 0) + 1;
                        }
                    });
                }
            } catch (err) {
                console.error("Error cargando estadísticas:", err);
            }
        }

        // VISTA 1: LISTADO GENERAL DE TEMAS CON CONTEO DE RESPUESTAS
        async function loadThreadsList() {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="forum-post-card">
                    <div style="color: var(--accent-emerald); font-weight: 700; margin-bottom: 6px; font-size: 1.05rem;">✍️ Apertura de Nuevo Debate</div>
                    <div style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 20px;">Indique un título descriptivo para su propuesta y exponga los detalles para la comunidad de Amposta.</div>
                    
                    <input type="text" id="thread-title" class="form-input" placeholder="Título del debate (ej. Modernización del alumbrado público)..." />
                    <textarea id="thread-content" class="form-textarea" placeholder="Redacte el contenido de su mensaje..."></textarea>
                    <button class="btn-action" onclick="createThread()">Publicar Tema en el Foro</button>
                </div>

                <div class="section-title">Debates Activos</div>
                <div class="section-desc">Listado oficial de conversaciones y propuestas ciudadanas registradas.</div>
                <div id="threads-container">
                    <div style="text-align: center; color: var(--text-muted); padding: 40px;">Cargando debates...</div>
                </div>
            `;

            const threadsContainer = document.getElementById('threads-container');
            try {
                const { data, error } = await supabaseClient
                    .from('forum_threads')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (!error && data && data.length > 0) {
                    threadsContainer.innerHTML = '';
                    const isUserAdmin = currentUser && currentUser.email === ADMIN_EMAIL;

                    data.forEach(thread => {
                        const dateFormatted = new Date(thread.created_at).toLocaleString();
                        const author = thread.author_name || 'Ciudadano';
                        const numReplies = threadReplyCounts[thread.id] || 0;

                        const itemCard = document.createElement('div');
                        itemCard.className = 'thread-item-card';

                        let modBtn = '';
                        if (isUserAdmin || (currentUser && thread.user_id === currentUser.id)) {
                            modBtn = `<button class="btn-delete" onclick="deleteThread(${thread.id})">🗑️ Eliminar</button>`;
                        }

                        itemCard.innerHTML = `
                            <div class="thread-main-info">
                                <a href="forum.html?id=${thread.id}" class="thread-title-link">📌 ${escapeHtml(thread.title)}</a>
                                <div class="thread-snippet">${escapeHtml(thread.content)}</div>
                                <div class="thread-meta-row">
                                    <span>Autor: <b>${escapeHtml(author)}</b></span>
                                    <span>Fecha: <b>${dateFormatted}</b></span>
                                    <span>Respuestas: <span class="badge-replies">💬 ${numReplies}</span></span>
                                </div>
                            </div>
                            <div class="thread-action-col">
                                <a href="forum.html?id=${thread.id}" class="btn-view">Ver Debate &rarr;</a>
                                ${modBtn}
                            </div>
                        `;
                        threadsContainer.appendChild(itemCard);
                    });
                } else {
                    threadsContainer.innerHTML = `<div style="text-align: center; color: var(--text-dim); padding: 40px; background: rgba(14, 19, 38, 0.4); border-radius: 12px; border: 1px dashed var(--border-subtle);">No existen debates activos en este momento. Sea el primero en iniciar una propuesta.</div>`;
                }
            } catch (err) {
                threadsContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">Error al conectar con la base de datos de debates.</div>`;
            }
        }

        // VISTA 2: DETALLE DEL HILO Y RESPUESTAS
        async function loadThreadDetail(threadId) {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <a href="forum.html" class="back-link">&larr; Volver al índice general de debates</a>
                <div id="single-thread-container"></div>
                
                <div class="forum-post-card" style="margin-top: 32px;">
                    <div style="color: var(--accent-emerald); font-weight: 700; margin-bottom: 6px; font-size: 1rem;">💬 Contribuir al Debate</div>
                    <textarea id="reply-content" class="form-textarea" placeholder="Escriba su réplica o aportación técnica..."></textarea>
                    <button class="btn-action" onclick="createReply(${threadId})">Enviar Respuesta</button>
                </div>

                <div class="section-title" style="margin-top: 36px;">Respuestas de la Comunidad</div>
                <div class="section-desc">Intervenciones y comentarios registrados en este hilo.</div>
                <div id="replies-container">
                    <div style="text-align: center; color: var(--text-muted); padding: 30px;">Cargando respuestas...</div>
                </div>
            `;

            try {
                const { data: thread, error: threadError } = await supabaseClient
                    .from('forum_threads')
                    .select('*')
                    .eq('id', threadId)
                    .single();

                if (threadError || !thread) {
                    container.innerHTML = `<a href="forum.html" class="back-link">&larr; Volver</a><div style="color: #ff6b6b; text-align: center; padding: 40px;">El tema seleccionado no está disponible o ha sido eliminado.</div>`;
                    return;
                }

                const isUserAdmin = currentUser && currentUser.email === ADMIN_EMAIL;
                const threadContainer = document.getElementById('single-thread-container');
                const author = thread.author_name || 'Ciudadano';
                const msgCount = userMessageCounts[thread.user_id] || 1;
                const isAdmin = thread.user_id === ADMIN_EMAIL || author.includes('edgartp89');

                let modBtn = '';
                if (isUserAdmin || (currentUser && thread.user_id === currentUser.id)) {
                    modBtn = `<button class="btn-delete" onclick="deleteThread(${thread.id}, true)">🗑️ Eliminar Hilo Completo</button>`;
                }

                threadContainer.innerHTML = `
                    <div class="post-box" style="border-color: rgba(0, 255, 136, 0.3);">
                        <div class="user-panel">
                            <div class="user-avatar" style="background: rgba(0, 255, 136, 0.1); border-color: rgba(0, 255, 136, 0.3);">🏛️</div>
                            <div>
                                <div class="user-name">${escapeHtml(author)}</div>
                                <div class="user-badge ${isAdmin ? 'admin' : ''}" style="background: rgba(0, 255, 136, 0.1); color: var(--accent-emerald); border-color: rgba(0, 255, 136, 0.3);">📌 Autor Principal</div>
                                <div class="user-stats">Aportaciones: <b>${msgCount}</b></div>
                            </div>
                        </div>
                        <div class="content-panel">
                            <div>
                                <div class="post-header-info">
                                    <span>📅 ${new Date(thread.created_at).toLocaleString()}</span>
                                    <span>#TemaCentral</span>
                                </div>
                                <div style="font-size: 1.25rem; font-weight: 700; color: #ffffff; margin-bottom: 12px;">📌 ${escapeHtml(thread.title)}</div>
                                <div class="post-text">${escapeHtml(thread.content)}</div>
                            </div>
                            <div class="post-footer">
                                <span></span>
                                ${modBtn}
                            </div>
                        </div>
                    </div>
                `;

                loadReplies(threadId);
            } catch (err) {
                console.error("Error al cargar detalle:", err);
            }
        }

        async function loadReplies(threadId) {
            const repliesContainer = document.getElementById('replies-container');
            try {
                const { data: replies, error } = await supabaseClient
                    .from('forum_replies')
                    .select('*')
                    .eq('thread_id', threadId)
                    .order('created_at', { ascending: true });

                if (!error && replies && replies.length > 0) {
                    repliesContainer.innerHTML = '';
                    const isUserAdmin = currentUser && currentUser.email === ADMIN_EMAIL;

                    replies.forEach(reply => {
                        const author = reply.author_name || 'Ciudadano';
                        const msgCount = userMessageCounts[reply.user_id] || 1;
                        const isAdmin = reply.user_id === ADMIN_EMAIL || author.includes('edgartp89');
                        const postBox = document.createElement('div');
                        postBox.className = 'post-box';

                        let deleteReplyBtn = '';
                        if (isUserAdmin || (currentUser && reply.user_id === currentUser.id)) {
                            deleteReplyBtn = `<button class="btn-delete" onclick="deleteReply(${reply.id}, ${threadId})">🗑️ Eliminar Respuesta</button>`;
                        }

                        postBox.innerHTML = `
                            <div class="user-panel">
                                <div class="user-avatar">💬</div>
                                <div>
                                    <div class="user-name">${escapeHtml(author)}</div>
                                    <div class="user-badge ${isAdmin ? 'admin' : ''}">${isAdmin ? '🛡️ Administrador' : '💬 Participante'}</div>
                                    <div class="user-stats">Aportaciones: <b>${msgCount}</b></div>
                                </div>
                            </div>
                            <div class="content-panel">
                                <div>
                                    <div class="post-header-info">
                                        <span>📅 ${new Date(reply.created_at).toLocaleString()}</span>
                                        <span>#Réplica</span>
                                    </div>
                                    <div class="post-text">${escapeHtml(reply.content)}</div>
                                </div>
                                <div class="post-footer">
                                    <span></span>
                                    ${deleteReplyBtn}
                                </div>
                            </div>
                        `;
                        repliesContainer.appendChild(postBox);
                    });
                } else {
                    repliesContainer.innerHTML = `<div style="text-align: center; color: var(--text-dim); padding: 30px; background: rgba(14, 19, 38, 0.4); border-radius: 12px; border: 1px dashed var(--border-subtle);">Aún no hay respuestas registradas en este debate.</div>`;
                }
            } catch (err) {
                repliesContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">Error al cargar las respuestas del hilo.</div>`;
            }
        }

        async function createThread() {
            if (!currentUser) return;
            const title = document.getElementById('thread-title').value.trim();
            const content = document.getElementById('thread-content').value.trim();

            if (!title || !content) {
                alert("El título y el contenido son obligatorios para publicar un tema.");
                return;
            }

            try {
                const authorName = currentUser.email ? currentUser.email.split('@')[0] : 'Ciudadano';
                const { error } = await supabaseClient.from('forum_threads').insert({
                    user_id: currentUser.id,
                    author_name: authorName,
                    title: title,
                    content: content
                });

                if (error) { alert("Error al registrar el tema."); return; }
                await loadForumStats();
                loadThreadsList();
            } catch (err) {
                console.error("Error:", err);
            }
        }

        async function createReply(threadId) {
            if (!currentUser) return;
            const content = document.getElementById('reply-content').value.trim();

            if (!content) {
                alert("El campo de respuesta no puede estar vacío.");
                return;
            }

            try {
                const authorName = currentUser.email ? currentUser.email.split('@')[0] : 'Ciudadano';
                const { error } = await supabaseClient.from('forum_replies').insert({
                    thread_id: threadId,
                    user_id: currentUser.id,
                    author_name: authorName,
                    content: content
                });

                if (error) { alert("Error al enviar la respuesta."); return; }
                document.getElementById('reply-content').value = '';
                await loadForumStats();
                loadReplies(threadId);
            } catch (err) {
                console.error("Error:", err);
            }
        }

        async function deleteThread(threadId, redirectToList = false) {
            if (!confirm("¿Confirma la eliminación definitiva de este hilo y todas sus respuestas asociadas?")) return;

            try {
                const { error } = await supabaseClient.from('forum_threads').delete().eq('id', threadId);
                if (error) { alert("Error al eliminar el tema."); return; }

                alert("Tema eliminado correctamente.");
                await loadForumStats();
                if (redirectToList) {
                    window.location.href = 'forum.html';
                } else {
                    loadThreadsList();
                }
            } catch (err) {
                console.error("Error:", err);
            }
        }

        async function deleteReply(replyId, threadId) {
            if (!confirm("¿Confirma la eliminación de esta respuesta?")) return;

            try {
                const { error } = await supabaseClient.from('forum_replies').delete().eq('id', replyId);
                if (error) { alert("Error al eliminar la respuesta."); return; }
                await loadForumStats();
                loadReplies(threadId);
            } catch (err) {
                console.error("Error:", err);
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
