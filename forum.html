<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro Oficial — Bit-Towns</title>
    <link rel="icon" type="image/png" href="favicon.png?v=1">
    <style>
        :root {
            --bg-base: #070913;
            --bg-surface: #0e1326;
            --bg-card: rgba(16, 22, 40, 0.85);
            --border-subtle: rgba(0, 240, 255, 0.12);
            --border-active: rgba(0, 240, 255, 0.35);
            --accent-cyan: #00f0ff;
            --accent-emerald: #00ff88;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Barra Superior Estilo Hattrick */
        .top-bar {
            background: #05070f;
            border-bottom: 1px solid var(--border-subtle);
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
        }
        .top-bar-left {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .top-bar-left a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s;
        }
        .top-bar-left a:hover, .top-bar-left a.active {
            color: var(--accent-cyan);
        }
        .top-bar-right {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .top-bar-right a {
            color: var(--accent-emerald);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.82rem;
            border: 1px solid rgba(0, 255, 136, 0.2);
            padding: 4px 12px;
            border-radius: 6px;
            background: rgba(0, 255, 136, 0.03);
        }

        /* Layout de Dos Columnas (Estilo Hattrick) */
        .forum-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        @media (max-width: 900px) {
            .forum-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Panel Lateral Izquierdo (Árbol de Foros) */
        .forum-sidebar {
            background: rgba(9, 12, 24, 0.95);
            border-right: 1px solid var(--border-subtle);
            padding: 20px;
            box-sizing: border-box;
        }
        .sidebar-section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }
        .forum-tree-list {
            list-style: none;
            padding: 0;
            margin: 0 0 24px 0;
        }
        .forum-tree-list li {
            margin-bottom: 6px;
        }
        .forum-tree-list a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all 0.15s;
        }
        .forum-tree-list a:hover, .forum-tree-list a.active {
            background: rgba(0, 240, 255, 0.08);
            color: #ffffff;
        }
        .forum-tree-list a.active {
            border-left: 3px solid var(--accent-cyan);
        }
        .forum-tree-sub {
            padding-left: 16px;
            margin-top: 4px;
            border-left: 1px dashed var(--border-subtle);
        }
        .sidebar-actions {
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid var(--border-subtle);
            padding-top: 16px;
        }
        .sidebar-actions a {
            color: var(--text-dim);
            text-decoration: none;
        }
        .sidebar-actions a:hover {
            color: var(--accent-cyan);
        }

        /* Contenido Principal Derecho */
        .forum-main-content {
            padding: 24px 32px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Migas de pan (Breadcrumbs) */
        .breadcrumbs {
            font-size: 0.82rem;
            color: var(--text-dim);
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .breadcrumbs a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        /* Barra de Herramientas Superior del Tema (Estilo Hattrick) */
        .thread-toolbar {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 10px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .thread-toolbar-left a {
            color: var(--accent-emerald);
            text-decoration: none;
            font-weight: 600;
        }
        .thread-toolbar-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .search-input {
            background: #05070f;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 5px 10px;
            color: #ffffff;
            font-size: 0.8rem;
            outline: none;
        }
        .btn-sm-action {
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-cyan);
            border: 1px solid var(--border-subtle);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Tarjeta de Publicación / Mensaje (Estilo Hattrick con autor a la derecha) */
        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            margin-bottom: 16px;
            display: grid;
            grid-template-columns: 1fr 200px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        @media (max-width: 768px) {
            .post-card {
                grid-template-columns: 1fr;
            }
        }
        .post-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .post-header-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-dim);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .post-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .post-text {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }

        /* Panel de Autor (Derecha, estilo Hattrick) */
        .post-author-panel {
            background: rgba(5, 7, 15, 0.9);
            border-left: 1px solid var(--border-subtle);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
        }
        @media (max-width: 768px) {
            .post-author-panel {
                border-left: none;
                border-top: 1px solid var(--border-subtle);
                flex-direction: row;
                justify-content: flex-start;
                gap: 16px;
                text-align: left;
                padding: 14px 20px;
            }
        }
        .author-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 255, 136, 0.15));
            border: 1px solid var(--border-active);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }
        @media (max-width: 768px) {
            .author-avatar { width: 38px; height: 38px; font-size: 1rem; margin-bottom: 0; }
        }
        .author-name {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--accent-cyan);
            text-decoration: none;
            margin-bottom: 4px;
            word-break: break-all;
        }
        .author-role {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .author-flag {
            font-size: 0.8rem;
        }

        /* Listado de Hilos en la vista principal */
        .thread-row-item {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.15s;
        }
        .thread-row-item:hover {
            border-color: var(--border-active);
        }
        .thread-row-title {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            display: block;
            margin-bottom: 4px;
        }
        .thread-row-title:hover {
            color: var(--accent-cyan);
        }
        .thread-row-meta {
            font-size: 0.78rem;
            color: var(--text-dim);
            display: flex;
            gap: 14px;
        }
        .badge-count {
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-cyan);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* Formularios de Creación */
        .form-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 24px;
            border-radius: 10px;
            margin-bottom: 24px;
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            background: #05070f;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: #fff;
            font-size: 0.88rem;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
        }
        .form-textarea { min-height: 90px; resize: vertical; }
        .btn-main {
            background: linear-gradient(135deg, var(--accent-emerald), var(--accent-cyan));
            color: #070913;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
        }
        .btn-danger {
            background: rgba(255, 75, 75, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255, 75, 75, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Barra Superior Hattrick Style -->
    <div class="top-bar">
        <div class="top-bar-left">
            <a href="index.html">🏠 Bit-Towns</a>
            <a href="board.html">🏛️ Tablero</a>
            <a href="forum.html" class="active">💬 Fòrum Oficial</a>
        </div>
        <div class="top-bar-right">
            <a href="profile.html">👤 Mi Perfil</a>
        </div>
    </div>

    <!-- Layout de Dos Columnas -->
    <div class="forum-layout">
        <!-- Panel Izquierdo: Árbol de Categorías (Estilo Hattrick) -->
        <div class="forum-sidebar">
            <div class="sidebar-section-title">Els meus fòrums</div>
            <ul class="forum-tree-list">
                <li>
                    <a href="forum.html" class="active"><span>💬 Fòrum General Amposta</span> <span style="color:var(--accent-cyan);">●</span></a>
                    <ul class="forum-tree-sub">
                        <li><a href="forum.html"><span>Anuncis Oficials</span> <span>4</span></a></li>
                        <li><a href="forum.html"><span>Debates Ciudadanos</span> <span id="tree-count" class="badge-count">0</span></a></li>
                    </ul>
                </li>
                <li><a href="board.html"><span>🏛️ Tablero de Gobierno</span></a></li>
                <li><a href="profile.html"><span>⚙️ Ajustes de Cuenta</span></a></li>
            </ul>

            <div class="sidebar-actions">
                <a href="forum.html">📥 Marcar fils com a llegits</a>
                <a href="forum.html">📂 Mostrar l'arxiu</a>
            </div>
        </div>

        <!-- Panel Principal Derecho -->
        <div class="forum-main-content" id="main-content">
            <div style="color: var(--text-muted); text-align: center; padding: 40px;">Cargando entorno de debate...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cxpsktskbvrkwtkolrpl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4cHNrdHNrYnZya3d0a29scnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTc1MjUsImV4cCI6MjEwNzAzMzUyNX0.9RJAEUxalZ3oI9DVWDr8x9s4QPpxWXZwMQBRm9lwVq0';

        let supabaseClient;
        let currentUser = null;
        const ADMIN_EMAIL = 'edgartp89@gmail.com';
        let threadReplyCounts = {};

        window.addEventListener('DOMContentLoaded', async () => {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                alert("Debes iniciar sesión para acceder al foro.");
                window.location.href = 'login.html';
                return;
            }

            currentUser = session.user;
            await loadCounts();

            const urlParams = new URLSearchParams(window.location.search);
            const threadId = urlParams.get('id');

            if (threadId) {
                loadThreadDetail(threadId);
            } else {
                loadThreadsList();
            }
        });

        async function loadCounts() {
            try {
                const { data: threads } = await supabaseClient.from('forum_threads').select('id');
                const { data: replies } = await supabaseClient.from('forum_replies').select('thread_id');

                threadReplyCounts = {};
                if (replies) {
                    replies.forEach(r => {
                        if (r.thread_id) threadReplyCounts[r.thread_id] = (threadReplyCounts[r.thread_id] || 0) + 1;
                    });
                }
                if (threads && document.getElementById('tree-count')) {
                    document.getElementById('tree-count').innerText = threads.length;
                }
            } catch (err) {
                console.error("Error cargando contadores:", err);
            }
        }

        // VISTA 1: Lista de Debates (Hattrick Style)
        async function loadThreadsList() {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="breadcrumbs">
                    <a href="forum.html">Fòrum</a> &raquo; <span>Debates Ciudadanos</span>
                </div>

                <div class="form-box">
                    <div style="color: var(--accent-emerald); font-weight: 700; margin-bottom: 10px; font-size: 0.95rem;">✍️ Crear Nou Fil de Debat</div>
                    <input type="text" id="thread-title" class="form-input" placeholder="Títol del fil..." />
                    <textarea id="thread-content" class="form-textarea" placeholder="Escriu el teu missatge per a la comunitat..."></textarea>
                    <button class="btn-main" onclick="createThread()">Publicar Fil</button>
                </div>

                <div style="font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; color: var(--text-main);">Fils actius de la comunitat</div>
                <div id="threads-list-container">
                    <div style="text-align: center; color: var(--text-dim); padding: 30px;">Carregant fils...</div>
                </div>
            `;

            const listContainer = document.getElementById('threads-list-container');
            try {
                const { data, error } = await supabaseClient
                    .from('forum_threads')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (!error && data && data.length > 0) {
                    listContainer.innerHTML = '';
                    const isUserAdmin = currentUser && currentUser.email === ADMIN_EMAIL;

                    data.forEach(thread => {
                        const dateFormatted = new Date(thread.created_at).toLocaleString();
                        const author = thread.author_name || 'Ciutadà';
                        const repliesCount = threadReplyCounts[thread.id] || 0;

                        let delBtn = '';
                        if (isUserAdmin || (currentUser && thread.user_id === currentUser.id)) {
                            delBtn = `<button class="btn-danger" onclick="deleteThread(${thread.id})">🗑️ Esborrar</button>`;
                        }

                        const item = document.createElement('div');
                        item.className = 'thread-row-item';
                        item.innerHTML = `
                            <div>
                                <a href="forum.html?id=${thread.id}" class="thread-row-title">📌 ${escapeHtml(thread.title)}</a>
                                <div class="thread-row-meta">
                                    <span>Autor: <b>${escapeHtml(author)}</b></span>
                                    <span>${dateFormatted}</span>
                                    <span>Respostes: <span class="badge-count">${repliesCount}</span></span>
                                </div>
                            </div>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <a href="forum.html?id=${thread.id}" class="btn-sm-action" style="text-decoration:none;">Veure Fil &rarr;</a>
                                ${delBtn}
                            </div>
                        `;
                        listContainer.appendChild(item);
                    });
                } else {
                    listContainer.innerHTML = `<div style="text-align: center; color: var(--text-dim); padding: 30px; background: var(--bg-surface); border-radius: 8px;">No hi ha fils actius en aquest fòrum. Sigues el primer a crear-ne un.</div>`;
                }
            } catch (err) {
                listContainer.innerHTML = `<div style="color: #ff6b6b; text-align: center;">Error al carregar els fils.</div>`;
            }
        }

        // VISTA 2: Detalle del Fil (Autor a la derecha, barra superior estilo Hattrick)
        async function loadThreadDetail(threadId) {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="breadcrumbs">
                    <a href="forum.html">Fòrum</a> &raquo; <a href="forum.html">Debates</a> &raquo; <span id="bc-title-tag">Detall</span>
                </div>

                <div class="thread-toolbar">
                    <div class="thread-toolbar-left">
                        <a href="forum.html">&larr; Tornar a la llista de fils</a>
                    </div>
                    <div class="thread-toolbar-right">
                        <input type="text" class="search-input" placeholder="Cerca al fil..." id="search-box" onkeyup="filterReplies()" />
                    </div>
                </div>

                <div id="thread-main-view"></div>

                <div class="form-box" style="margin-top: 24px;">
                    <div style="color: var(--accent-emerald); font-weight: 700; margin-bottom: 8px; font-size: 0.9rem;">💬 Respon al fil</div>
                    <textarea id="reply-content" class="form-textarea" placeholder="Escriu la teva rèplica..."></textarea>
                    <button class="btn-main" onclick="createReply(${threadId})">Enviar Resposta</button>
                </div>

                <div style="font-size: 0.95rem; font-weight: 700; margin: 24px 0 12px 0;">Respostes de la Comunitat</div>
                <div id="replies-list-container">
                    <div style="text-align: center; color: var(--text-dim); padding: 20px;">Carregant respostes...</div>
                </div>
            `;

            try {
                const { data: thread, error } = await supabaseClient
                    .from('forum_threads')
                    .select('*')
                    .eq('id', threadId)
                    .single();

                if (error || !thread) {
                    container.innerHTML = `<div style="color: #ff6b6b; text-align: center; padding: 40px;">El fil sol·licitat no existeix o ha estat eliminat.</div>`;
                    return;
                }

                document.getElementById('bc-title-tag').innerText = thread.title;
                const isUserAdmin = currentUser && currentUser.email === ADMIN_EMAIL;
                const author = thread.author_name || 'Ciutadà';
                const isAdmin = thread.user_id === ADMIN_EMAIL || author.includes('edgartp89');

                let delBtn = '';
                if (isUserAdmin || (currentUser && thread.user_id === currentUser.id)) {
                    delBtn = `<button class="btn-danger" onclick="deleteThread(${thread.id}, true)">🗑️ Esborrar Fil Complet</button>`;
                }

                document.getElementById('thread-main-view').innerHTML = `
                    <div class="post-card" style="border-color: rgba(0,255,136,0.3);">
                        <div class="post-body">
                            <div>
                                <div class="post-header-meta">
                                    <span>📅 ${new Date(thread.created_at).toLocaleString()}</span>
                                    <span>#MissatgePrincipal</span>
                                </div>
                                <div class="post-title">📌 ${escapeHtml(thread.title)}</div>
                                <div class="post-text">${escapeHtml(thread.content)}</div>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(255,255,255,0.03); padding-top:10px;">
                                <span></span>
                                ${delBtn}
                            </div>
                        </div>
                        <div class="post-author-panel">
                            <div class="author-avatar" style="background:rgba(0,255,136,0.1); border-color:rgba(0,255,136,0.3);">🏛️</div>
                            <div>
                                <div class="author-name">${escapeHtml(author)}</div>
                                <div class="author-role">${isAdmin ? '🛡️ Admin' : '💬 Ciutadà'}</div>
                                <div class="author-flag">🇪🇸 Amposta</div>
                            </div>
                        </div>
                    </div>
                `;

                loadReplies(threadId);
            } catch (err) {
                console.error("Error al carregar fil:", err);
            }
        }

        async function loadReplies(threadId) {
            const container = document.getElementById('replies-list-container');
            try {
                const { data: replies, error } = await supabaseClient
                    .from('forum_replies')
                    .select('*')
                    .eq('thread_id', threadId)
                    .order('created_at', { ascending: true });

                if (!error && replies && replies.length > 0) {
                    container.innerHTML = '';
                    const isUserAdmin = currentUser && currentUser.email === ADMIN_EMAIL;

                    replies.forEach(reply => {
                        const author = reply.author_name || 'Ciutadà';
                        const isAdmin = reply.user_id === ADMIN_EMAIL || author.includes('edgartp89');

                        let delReplyBtn = '';
                        if (isUserAdmin || (currentUser && reply.user_id === currentUser.id)) {
                            delReplyBtn = `<button class="btn-danger" onclick="deleteReply(${reply.id}, ${threadId})">🗑️ Esborrar</button>`;
                        }

                        const card = document.createElement('div');
                        card.className = 'post-card reply-item';
                        card.innerHTML = `
                            <div class="post-body">
                                <div>
                                    <div class="post-header-meta">
                                        <span>📅 ${new Date(reply.created_at).toLocaleString()}</span>
                                        <span>#Rèplica</span>
                                    </div>
                                    <div class="post-text">${escapeHtml(reply.content)}</div>
                                </div>
                                <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(255,255,255,0.03); padding-top:10px;">
                                    <span></span>
                                    ${delReplyBtn}
                                </div>
                            </div>
                            <div class="post-author-panel">
                                <div class="author-avatar">💬</div>
                                <div>
                                    <div class="author-name">${escapeHtml(author)}</div>
                                    <div class="author-role">${isAdmin ? '🛡️ Admin' : '💬 Participant'}</div>
                                    <div class="author-flag">🇪🇸 Amposta</div>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<div style="text-align: center; color: var(--text-dim); padding: 25px; background: var(--bg-surface); border-radius: 8px;">Encara no hi ha respostes en aquest fil.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div style="color: #ff6b6b; text-align: center;">Error al carregar respostes.</div>`;
            }
        }

        async function createThread() {
            if (!currentUser) return;
            const title = document.getElementById('thread-title').value.trim();
            const content = document.getElementById('thread-content').value.trim();
            if (!title || !content) {
                alert("El títol i el contingut són obligatoris.");
                return;
            }
            try {
                const authorName = currentUser.email ? currentUser.email.split('@')[0] : 'Ciutadà';
                const { error } = await supabaseClient.from('forum_threads').insert({
                    user_id: currentUser.id,
                    author_name: authorName,
                    title: title,
                    content: content
                });
                if (error) { alert("Error al crear el fil."); return; }
                await loadCounts();
                loadThreadsList();
            } catch (err) { console.error(err); }
        }

        async function createReply(threadId) {
            if (!currentUser) return;
            const content = document.getElementById('reply-content').value.trim();
            if (!content) {
                alert("La resposta no pot estar buida.");
                return;
            }
            try {
                const authorName = currentUser.email ? currentUser.email.split('@')[0] : 'Ciutadà';
                const { error } = await supabaseClient.from('forum_replies').insert({
                    thread_id: threadId,
                    user_id: currentUser.id,
                    author_name: authorName,
                    content: content
                });
                if (error) { alert("Error al enviar la resposta."); return; }
                document.getElementById('reply-content').value = '';
                await loadCounts();
                loadReplies(threadId);
            } catch (err) { console.error(err); }
        }

        async function deleteThread(threadId, redirectToList = false) {
            if (!confirm("Vols eliminar definitivament aquest fil?")) return;
            try {
                const { error } = await supabaseClient.from('forum_threads').delete().eq('id', threadId);
                if (error) { alert("Error al eliminar."); return; }
                await loadCounts();
                if (redirectToList) window.location.href = 'forum.html';
                else loadThreadsList();
            } catch (err) { console.error(err); }
        }

        async function deleteReply(replyId, threadId) {
            if (!confirm("Vols eliminar aquesta resposta?")) return;
            try {
                const { error } = await supabaseClient.from('forum_replies').delete().eq('id', replyId);
                if (error) { alert("Error al eliminar."); return; }
                await loadCounts();
                loadReplies(threadId);
            } catch (err) { console.error(err); }
        }

        function filterReplies() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const items = document.querySelectorAll('.reply-item');
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(query) ? 'grid' : 'none';
            });
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '#' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
