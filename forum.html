<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fòrum — Bit-Towns</title>
    <link rel="icon" type="image/png" href="favicon.png?v=1">
    <style>
        :root {
            --ht-bg-top: #23582b;
            --ht-bg-base: #1b4421;
            --ht-bg-sidebar: #286331;
            --ht-bg-content: #ffffff;
            --ht-bg-alt: #f4f6f3;
            --ht-border: #cccccc;
            --ht-border-dark: #123017;
            --ht-text-main: #1f2937;
            --ht-text-muted: #4b5563;
            --ht-link: #1a4d2e;
            --ht-accent: #357a3d;
        }

        body {
            background-color: var(--ht-bg-base);
            color: var(--ht-text-main);
            font-family: Arial, Tahoma, Verdana, sans-serif;
            font-size: 14px; /* Aumentado para mejor legibilidad */
            line-height: 1.5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Barra Superior Hattrick Classic */
        .ht-topbar {
            background-color: var(--ht-bg-top);
            color: #ffffff;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--ht-border-dark);
            font-weight: bold;
            font-size: 14px;
        }
        .ht-topbar-nav {
            display: flex;
            gap: 18px;
            align-items: center;
        }
        .ht-topbar-nav a {
            color: #ffffff;
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 3px;
        }
        .ht-topbar-nav a:hover, .ht-topbar-nav a.active {
            background-color: rgba(0, 0, 0, 0.25);
        }

        /* Layout General en Dos Columnas */
        .ht-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            flex: 1;
            max-width: 1500px;
            width: 100%;
            margin: 0 auto;
            background-color: #ffffff;
        }
        @media (max-width: 900px) {
            .ht-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Panel Izquierdo (Árbol de Foros Hattrick) */
        .ht-sidebar {
            background-color: #f0f3ef;
            border-right: 1px solid var(--ht-border);
            padding: 16px;
            box-sizing: border-box;
            font-size: 13px;
        }
        .ht-sidebar-title {
            font-weight: bold;
            color: #ffffff;
            background-color: var(--ht-accent);
            padding: 8px 12px;
            margin-bottom: 10px;
            border-radius: 2px;
            font-size: 13px;
        }
        .ht-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
        }
        .ht-tab {
            background: #e2e8e0;
            border: 1px solid #c5cdc2;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 2px 2px 0 0;
            text-decoration: none;
            color: #333;
        }
        .ht-tab.active {
            background: #ffffff;
            border-bottom: 1px solid #ffffff;
            font-weight: bold;
        }
        .ht-tree-list {
            list-style: none;
            padding: 0;
            margin: 0 0 18px 0;
        }
        .ht-tree-list li {
            margin: 5px 0;
        }
        .ht-tree-list a {
            color: var(--ht-link);
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            padding: 4px 6px;
            font-size: 13px;
        }
        .ht-tree-list a:hover {
            text-decoration: underline;
            background-color: rgba(53, 122, 61, 0.1);
        }
        .ht-tree-sub {
            padding-left: 14px;
            margin-top: 4px;
            border-left: 1px dotted #999;
        }
        .ht-sidebar-links {
            border-top: 1px solid var(--ht-border);
            padding-top: 12px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .ht-sidebar-links a {
            color: #333;
            text-decoration: none;
            font-size: 12px;
        }
        .ht-sidebar-links a:hover {
            text-decoration: underline;
        }

        /* Contenido Principal Derecho */
        .ht-main {
            padding: 20px 24px;
            box-sizing: border-box;
            background-color: #ffffff;
        }

        /* Ruta / Migas de Pan Estilo Hattrick */
        .ht-breadcrumbs {
            font-size: 12px;
            color: var(--ht-text-muted);
            margin-bottom: 14px;
            background: #f8faf7;
            padding: 8px 12px;
            border: 1px solid var(--ht-border);
            border-radius: 3px;
        }
        .ht-breadcrumbs a {
            color: var(--ht-link);
            text-decoration: none;
            font-weight: 600;
        }

        /* Barra de Herramientas del Hilo */
        .ht-toolbar {
            background: #f0f4ee;
            border: 1px solid var(--ht-border);
            padding: 10px 14px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border-radius: 3px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .ht-toolbar input {
            padding: 5px 10px;
            font-size: 13px;
            border: 1px solid var(--ht-border);
            border-radius: 2px;
            width: 220px;
        }
        .ht-btn {
            background: #e1e8df;
            border: 1px solid #b0bcac;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 2px;
            font-weight: bold;
            color: #222;
        }
        .ht-btn:hover {
            background: #d4ebd0;
        }
        .ht-btn-danger {
            background: #fde8e8;
            border-color: #f5c2c2;
            color: #a80000;
        }
        .ht-btn-danger:hover {
            background: #fbd5d5;
        }

        /* Tarjeta de Mensaje / Publicación Estilo Hattrick */
        .ht-post-box {
            border: 1px solid var(--ht-border);
            margin-bottom: 14px;
            display: grid;
            grid-template-columns: 1fr 200px;
            background: #ffffff;
            border-radius: 3px;
        }
        @media (max-width: 768px) {
            .ht-post-box {
                grid-template-columns: 1fr;
            }
        }
        .ht-post-content {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .ht-post-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--ht-text-muted);
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .ht-post-title {
            font-size: 15px;
            font-weight: bold;
            color: #111;
            margin-bottom: 10px;
        }
        .ht-post-text {
            font-size: 13.5px;
            color: #222;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }

        /* Panel de Autor Derecha (Estilo Hattrick exacto) */
        .ht-author-panel {
            background-color: #f9fbf8;
            border-left: 1px solid var(--ht-border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
        }
        @media (max-width: 768px) {
            .ht-author-panel {
                border-left: none;
                border-top: 1px solid var(--ht-border);
                flex-direction: row;
                justify-content: flex-start;
                gap: 16px;
                text-align: left;
                padding: 12px 16px;
            }
        }
        .ht-author-avatar {
            width: 56px;
            height: 56px;
            background: #e2e8e0;
            border: 1px solid #b5c2b0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 8px;
            border-radius: 2px;
        }
        @media (max-width: 768px) {
            .ht-author-avatar { width: 40px; height: 40px; font-size: 18px; margin-bottom: 0; }
        }
        .ht-author-name {
            font-weight: bold;
            color: var(--ht-link);
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 3px;
            word-break: break-all;
        }
        .ht-author-club {
            font-size: 11.5px;
            color: var(--ht-text-muted);
            margin-bottom: 6px;
        }

        /* Formularios y Cajas de Edición */
        .ht-form-box {
            background: #f4f6f3;
            border: 1px solid var(--ht-border);
            padding: 16px;
            margin-bottom: 20px;
            border-radius: 3px;
        }
        .ht-input, .ht-textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--ht-border);
            border-radius: 2px;
            font-family: inherit;
            font-size: 13.5px;
            margin-bottom: 10px;
            box-sizing: border-box;
            background: #fff;
        }
        .ht-textarea { min-height: 100px; resize: vertical; }

        /* Filas de la lista de hilos */
        .ht-thread-row {
            background: #ffffff;
            border: 1px solid var(--ht-border);
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 2px;
        }
        .ht-thread-row:hover {
            background: #f9fbf8;
        }
        .ht-thread-link {
            font-weight: bold;
            color: var(--ht-link);
            text-decoration: none;
            font-size: 14px;
            display: block;
            margin-bottom: 4px;
        }
        .ht-thread-link:hover {
            text-decoration: underline;
        }
        .ht-thread-meta {
            font-size: 12px;
            color: var(--ht-text-muted);
            display: flex;
            gap: 16px;
        }
        .ht-badge {
            background: #e2e8e0;
            padding: 2px 6px;
            border-radius: 2px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- Barra Superior Hattrick -->
    <div class="ht-topbar">
        <div class="ht-topbar-nav">
            <a href="index.html">🏠 Bit-Towns</a>
            <a href="board.html">🏛️ Tabler de Govern</a>
            <a href="forum.html" class="active">💬 Fòrum Oficial</a>
        </div>
        <div style="font-size: 13px;">
            <a href="profile.html" style="color:#ffffff; text-decoration:none;">👤 Mi Perfil</a>
        </div>
    </div>

    <!-- Layout Principal Hattrick -->
    <div class="ht-layout">
        <!-- Panel Izquierdo: Árbol Estilo Hattrick -->
        <div class="ht-sidebar">
            <div class="ht-sidebar-title">Els meus fòrums</div>
            <div class="ht-tabs">
                <span class="ht-tab active">Nous</span>
                <span class="ht-tab">Prioritaris</span>
                <span class="ht-tab">Tots</span>
            </div>
            
            <ul class="ht-tree-list">
                <li>
                    <a href="forum.html"><span>🇪🇸 Espanya / Amposta</span> <span>1/1</span></a>
                    <ul class="ht-tree-sub">
                        <li><a href="forum.html"><span>Anuncis Oficials</span> <span>4</span></a></li>
                        <li><a href="forum.html"><span>Fòrum General</span> <span id="tree-count" class="ht-badge">0</span></a></li>
                    </ul>
                </li>
                <li><a href="board.html"><span>🏛️ Govern Local</span></a></li>
            </ul>

            <div class="ht-sidebar-links">
                <a href="forum.html">✉️ Marcar fils com a llegits</a>
                <a href="forum.html">📂 Mostrar l'arxiu</a>
                <a href="forum.html">🔍 Cercar al fòrum</a>
            </div>
        </div>

        <!-- Panel Principal Derecho -->
        <div class="ht-main" id="ht-main-content">
            <div style="text-align: center; color: var(--ht-text-muted); padding: 40px;">Carregant fòrum...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cxpsktskbvrkwtkolrpl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4cHNrdHNrYnZya3d0a29scnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTc1MjUsImV4cCI6MjEwNzAzMzUyNX0.9RJAEUxalZ3oI9DVWDr8x9s4QPpxWXZwMQBRm9lwVq0';

        let supabaseClient;
        let currentUser = null;
        const ADMIN_EMAIL = 'edgartp89@gmail.com';
        let threadReplyCounts = {};

        window.addEventListener('DOMContentLoaded', async () => {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                alert("Debes iniciar sesión para acceder al foro.");
                window.location.href = 'login.html';
                return;
            }

            currentUser = session.user;
            await loadCounts();

            const urlParams = new URLSearchParams(window.location.search);
            const threadId = urlParams.get('id');

            if (threadId) {
                loadThreadDetail(threadId);
            } else {
                loadThreadsList();
            }
        });

        async function loadCounts() {
            try {
                const { data: threads } = await supabaseClient.from('forum_threads').select('id');
                const { data: replies } = await supabaseClient.from('forum_replies').select('thread_id');

                threadReplyCounts = {};
                if (replies) {
                    replies.forEach(r => {
                        if (r.thread_id) threadReplyCounts[r.thread_id] = (threadReplyCounts[r.thread_id] || 0) + 1;
                    });
                }
                if (threads && document.getElementById('tree-count')) {
                    document.getElementById('tree-count').innerText = threads.length;
                }
            } catch (err) {
                console.error("Error contadors:", err);
            }
        }

        // VISTA 1: LISTADO DE HILOS (Hattrick Style)
        async function loadThreadsList() {
            const container = document.getElementById('ht-main-content');
            container.innerHTML = `
                <div class="ht-breadcrumbs">
                    <a href="forum.html">Fòrum</a> &raquo; <span>Fòrum General Amposta</span>
                </div>

                <div class="ht-form-box">
                    <div style="font-weight: bold; color: var(--ht-link); margin-bottom: 8px; font-size: 13.5px;">✍️ Crear Nou Fil de Debat</div>
                    <input type="text" id="thread-title" class="ht-input" placeholder="Títol del fil..." />
                    <textarea id="thread-content" class="ht-textarea" placeholder="Escriu el teu missatge..."></textarea>
                    <button class="ht-btn" onclick="createThread()">Publicar Fil</button>
                </div>

                <div style="font-weight: bold; margin-bottom: 10px; font-size: 13.5px; color: #333;">Llistat de fils actius</div>
                <div id="ht-threads-container">
                    <div style="text-align: center; color: var(--ht-text-muted); padding: 30px;">Carregant fils...</div>
                </div>
            `;

            const listContainer = document.getElementById('ht-threads-container');
            try {
                const { data, error } = await supabaseClient
                    .from('forum_threads')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (!error && data && data.length > 0) {
                    listContainer.innerHTML = '';
                    const isUserAdmin = currentUser && currentUser.email === ADMIN_EMAIL;

                    data.forEach(thread => {
                        const dateFormatted = new Date(thread.created_at).toLocaleString();
                        const author = thread.author_name || 'Ciutadà';
                        const repliesCount = threadReplyCounts[thread.id] || 0;

                        let delBtn = '';
                        if (isUserAdmin || (currentUser && thread.user_id === currentUser.id)) {
                            delBtn = `<button class="ht-btn ht-btn-danger" onclick="deleteThread(${thread.id})">🗑️ Esborrar</button>`;
                        }

                        const item = document.createElement('div');
                        item.className = 'ht-thread-row';
                        item.innerHTML = `
                            <div>
                                <a href="forum.html?id=${thread.id}" class="ht-thread-link">📌 ${escapeHtml(thread.title)}</a>
                                <div class="ht-thread-meta">
                                    <span>Autor: <b>${escapeHtml(author)}</b></span>
                                    <span>${dateFormatted}</span>
                                    <span>Respostes: <span class="ht-badge">${repliesCount}</span></span>
                                </div>
                            </div>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <a href="forum.html?id=${thread.id}" class="ht-btn" style="text-decoration:none;">Veure Fil &rarr;</a>
                                ${delBtn}
                            </div>
                        `;
                        listContainer.appendChild(item);
                    });
                } else {
                    listContainer.innerHTML = `<div style="text-align: center; color: var(--ht-text-muted); padding: 30px; border: 1px solid var(--ht-border); background:#f9fbf8;">No hi ha fils actius. Sigues el primer en obrir un debat.</div>`;
                }
            } catch (err) {
                listContainer.innerHTML = `<div style="color: #a80000; text-align: center;">Error al carregar els fils.</div>`;
            }
        }

        // VISTA 2: DETALLE DEL HILO (Hattrick Exact Layout)
        async function loadThreadDetail(threadId) {
            const container = document.getElementById('ht-main-content');
            container.innerHTML = `
                <div class="ht-breadcrumbs">
                    <a href="forum.html">Fòrum</a> &raquo; <a href="forum.html">General</a> &raquo; <span id="ht-bc-title">Detall</span>
                </div>

                <div class="ht-toolbar">
                    <div>
                        <a href="forum.html" class="ht-btn" style="text-decoration:none;">&larr; Tornar a la llista</a>
                    </div>
                    <div>
                        <input type="text" id="search-box" placeholder="Cerca al fil..." onkeyup="filterReplies()" />
                    </div>
                </div>

                <div id="ht-thread-main"></div>

                <div class="ht-form-box" style="margin-top: 20px;">
                    <div style="font-weight: bold; color: var(--ht-link); margin-bottom: 8px; font-size: 13.5px;">💬 Enviar Resposta</div>
                    <textarea id="reply-content" class="ht-textarea" placeholder="Escriu la teva rèplica..."></textarea>
                    <button class="ht-btn" onclick="createReply(${threadId})">Enviar Resposta</button>
                </div>

                <div style="font-weight: bold; margin: 20px 0 10px 0; font-size: 13.5px; color: #333;">Respostes de la Comunitat</div>
                <div id="ht-replies-container">
                    <div style="text-align: center; color: var(--ht-text-muted); padding: 30px;">Carregant respostes...</div>
                </div>
            `;

            try {
                const { data: thread, error } = await supabaseClient
                    .from('forum_threads')
                    .select('*')
                    .eq('id', threadId)
                    .single();

                if (error || !thread) {
                    container.innerHTML = `<div style="color: #a80000; text-align: center; padding: 40px;">El fil no existeix o ha estat eliminat.</div>`;
                    return;
                }

                document.getElementById('ht-bc-title').innerText = thread.title;
                const isUserAdmin = currentUser && currentUser.email === ADMIN_EMAIL;
                const author = thread.author_name || 'Ciutadà';
                const isAdmin = thread.user_id === ADMIN_EMAIL || author.includes('edgartp89');

                let delBtn = '';
                if (isUserAdmin || (currentUser && thread.user_id === currentUser.id)) {
                    delBtn = `<button class="ht-btn ht-btn-danger" onclick="deleteThread(${thread.id}, true)">🗑️ Esborrar Fil</button>`;
                }

                document.getElementById('ht-thread-main').innerHTML = `
                    <div class="ht-post-box" style="border-color: #357a3d;">
                        <div class="ht-post-content">
                            <div>
                                <div class="ht-post-header">
                                    <span>📅 ${new Date(thread.created_at).toLocaleString()}</span>
                                    <span>#MissatgePrincipal</span>
                                </div>
                                <div class="ht-post-title">📌 ${escapeHtml(thread.title)}</div>
                                <div class="ht-post-text">${escapeHtml(thread.content)}</div>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #eee; padding-top:10px;">
                                <span></span>
                                ${delBtn}
                            </div>
                        </div>
                        <div class="ht-author-panel">
                            <div class="ht-author-avatar">🏛️</div>
                            <div>
                                <a href="profile.html" class="ht-author-name">${escapeHtml(author)}</a>
                                <div class="ht-author-club">${isAdmin ? '🛡️ Admin' : '💬 Ciutadà'}</div>
                                <div style="font-size:11px; color:#555;">🇪🇸 Amposta</div>
                            </div>
                        </div>
                    </div>
                `;

                loadReplies(threadId);
            } catch (err) {
                console.error("Error al carregar fil:", err);
            }
        }

        async function loadReplies(threadId) {
            const container = document.getElementById('ht-replies-container');
            try {
                const { data: replies, error } = await supabaseClient
                    .from('forum_replies')
                    .select('*')
                    .eq('thread_id', threadId)
                    .order('created_at', { ascending: true });

                if (!error && replies && replies.length > 0) {
                    container.innerHTML = '';
                    const isUserAdmin = currentUser && currentUser.email === ADMIN_EMAIL;

                    replies.forEach(reply => {
                        const author = reply.author_name || 'Ciutadà';
                        const isAdmin = reply.user_id === ADMIN_EMAIL || author.includes('edgartp89');

                        let delReplyBtn = '';
                        if (isUserAdmin || (currentUser && reply.user_id === currentUser.id)) {
                            delReplyBtn = `<button class="ht-btn ht-btn-danger" onclick="deleteReply(${reply.id}, ${threadId})">🗑️ Esborrar</button>`;
                        }

                        const card = document.createElement('div');
                        card.className = 'ht-post-box ht-reply-item';
                        card.innerHTML = `
                            <div class="ht-post-content">
                                <div>
                                    <div class="ht-post-header">
                                        <span>📅 ${new Date(reply.created_at).toLocaleString()}</span>
                                        <span>#Rèplica</span>
                                    </div>
                                    <div class="ht-post-text">${escapeHtml(reply.content)}</div>
                                </div>
                                <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #eee; padding-top:10px;">
                                    <span></span>
                                    ${delReplyBtn}
                                </div>
                            </div>
                            <div class="ht-author-panel">
                                <div class="ht-author-avatar">💬</div>
                                <div>
                                    <a href="profile.html" class="ht-author-name">${escapeHtml(author)}</a>
                                    <div class="ht-author-club">${isAdmin ? '🛡️ Admin' : '💬 Participant'}</div>
                                    <div style="font-size:11px; color:#555;">🇪🇸 Amposta</div>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<div style="text-align: center; color: var(--ht-text-muted); padding: 20px; border: 1px solid var(--ht-border); background:#f9fbf8;">Encara no hi ha respostes en aquest fil.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div style="color: #a80000; text-align: center;">Error al carregar respostes.</div>`;
            }
        }

        async function createThread() {
            if (!currentUser) return;
            const title = document.getElementById('thread-title').value.trim();
            const content = document.getElementById('thread-content').value.trim();
            if (!title || !content) {
                alert("El títol i el contingut són obligatoris.");
                return;
            }
            try {
                const authorName = currentUser.email ? currentUser.email.split('@')[0] : 'Ciutadà';
                const { error } = await supabaseClient.from('forum_threads').insert({
                    user_id: currentUser.id,
                    author_name: authorName,
                    title: title,
                    content: content
                });
                if (error) { alert("Error al crear el fil."); return; }
                await loadCounts();
                loadThreadsList();
            } catch (err) { console.error(err); }
        }

        async function createReply(threadId) {
            if (!currentUser) return;
            const content = document.getElementById('reply-content').value.trim();
            if (!content) {
                alert("La resposta no pot estar buida.");
                return;
            }
            try {
                const authorName = currentUser.email ? currentUser.email.split('@')[0] : 'Ciutadà';
                const { error } = await supabaseClient.from('forum_replies').insert({
                    thread_id: threadId,
                    user_id: currentUser.id,
                    author_name: authorName,
                    content: content
                });
                if (error) { alert("Error al enviar la resposta."); return; }
                document.getElementById('reply-content').value = '';
                await loadCounts();
                loadReplies(threadId);
            } catch (err) { console.error(err); }
        }

        async function deleteThread(threadId, redirectToList = false) {
            if (!confirm("Vols eliminar definitivament aquest fil?")) return;
            try {
                const { error } = await supabaseClient.from('forum_threads').delete().eq('id', threadId);
                if (error) { alert("Error al eliminar."); return; }
                await loadCounts();
                if (redirectToList) window.location.href = 'forum.html';
                else loadThreadsList();
            } catch (err) { console.error(err); }
        }

        async function deleteReply(replyId, threadId) {
            if (!confirm("Vols eliminar aquesta resposta?")) return;
            try {
                const { error } = await supabaseClient.from('forum_replies').delete().eq('id', replyId);
                if (error) { alert("Error al eliminar."); return; }
                await loadCounts();
                loadReplies(threadId);
            } catch (err) { console.error(err); }
        }

        function filterReplies() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const items = document.querySelectorAll('.ht-reply-item');
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(query) ? 'grid' : 'none';
            });
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
