<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro Comunitario - Bit-Towns</title>
    <link rel="icon" type="image/png" href="favicon.png?v=1">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            padding: 18px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #00f0ff, #9d4edd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .nav-links {
            display: flex;
            gap: 12px;
        }
        .btn-nav {
            color: #00f0ff;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 8px 18px;
            border-radius: 24px;
            background: rgba(0, 240, 255, 0.05);
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .btn-nav:hover {
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
        }
        .btn-profile {
            color: #ffb703;
            border-color: rgba(255, 183, 3, 0.4);
            background: rgba(255, 183, 3, 0.08);
        }
        .btn-profile:hover {
            background: rgba(255, 183, 3, 0.2);
            box-shadow: 0 0 12px rgba(255, 183, 3, 0.25);
        }

        .container {
            max-width: 920px;
            width: 100%;
            margin: 35px auto;
            padding: 0 24px;
            box-sizing: border-box;
            flex: 1;
        }

        .section-title {
            color: #f8fafc;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }
        .section-desc {
            color: #94a3b8;
            font-size: 0.92rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .forum-post-card {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.04), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(0, 255, 136, 0.25);
            padding: 24px;
            border-radius: 18px;
            margin-bottom: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.92rem;
            margin-bottom: 16px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            resize: vertical;
            min-height: 90px;
            transition: border-color 0.2s;
        }
        .form-textarea:focus {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .btn-action {
            background: linear-gradient(135deg, #00ff88, #00f0ff);
            color: #0b0f19;
            border: none;
            padding: 12px 22px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.25);
        }
        .btn-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }

        .forum-message {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px;
            transition: border-color 0.2s;
        }
        .forum-message:hover {
            border-color: rgba(0, 240, 255, 0.4);
        }
        .forum-author {
            color: #00f0ff;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }
        .forum-date {
            color: #64748b;
            font-size: 0.78rem;
        }
        .forum-text {
            color: #cbd5e1;
            font-size: 0.92rem;
            margin-top: 10px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <span style="font-size: 1.8rem;">💬</span>
            <h1>Foro Comunitario — Bit-Towns</h1>
        </div>
        <div class="nav-links">
            <a href="board.html" class="btn-nav">🏛️ Tablero</a>
            <a href="profile.html" class="btn-profile">👤 Mi Perfil</a>
            <a href="index.html" class="btn-nav">🏠 Inicio</a>
        </div>
    </div>

    <div class="container">
        <div class="forum-post-card">
            <div style="color: #00ff88; font-weight: 700; margin-bottom: 6px; font-size: 1.1rem;">✍️ Publicar un nuevo mensaje</div>
            <div style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 18px;">Comparte ideas, propuestas de inversión o charla con otros ciudadanos de Amposta.</div>
            <textarea id="forum-content" class="form-textarea" placeholder="Escribe tu mensaje para la comunidad..."></textarea>
            <button class="btn-action" onclick="submitForumPost()">Publicar Mensaje</button>
        </div>

        <div class="section-title">Debates Recientes</div>
        <div class="section-desc">Mensajes en tiempo real de los ciudadanos registrados.</div>
        <div id="forum-messages-container">
            <div style="text-align: center; color: #94a3b8; padding: 40px;">Cargando mensajes del foro...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cxpsktskbvrkwtkolrpl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4cHNrdHNrYnZya3d0a29scnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTc1MjUsImV4cCI6MjEwNzAzMzUyNX0.9RJAEUxalZ3oI9DVWDr8x9s4QPpxWXZwMQBRm9lwVq0';

        let supabaseClient;
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', async () => {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // CONTROL DE ACCESO: Solo usuarios registrados
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                alert("Debes iniciar sesión para acceder al foro de la comunidad.");
                window.location.href = 'login.html';
                return;
            }

            currentUser = session.user;
            loadForumPosts();
        });

        async function loadForumPosts() {
            const container = document.getElementById('forum-messages-container');
            try {
                const { data, error } = await supabaseClient
                    .from('forum_posts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (!error && data && data.length > 0) {
                    container.innerHTML = '';
                    data.forEach(post => {
                        const dateFormatted = new Date(post.created_at).toLocaleString();
                        const msgDiv = document.createElement('div');
                        msgDiv.className = 'forum-message';
                        msgDiv.innerHTML = `
                            <div class="forum-author">👤 ${post.author_name || 'Ciudadano'}</div>
                            <div class="forum-date">${dateFormatted}</div>
                            <div class="forum-text">${escapeHtml(post.content)}</div>
                        `;
                        container.appendChild(msgDiv);
                    });
                } else {
                    container.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 40px; background: rgba(15, 23, 42, 0.4); border-radius: 14px; border: 1px dashed rgba(255,255,255,0.1);">Aún no hay mensajes en el foro. ¡Sé el primero en escribir uno!</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 20px;">Error al cargar los mensajes del foro.</div>`;
            }
        }

        async function submitForumPost() {
            if (!currentUser) return;

            const content = document.getElementById('forum-content').value.trim();
            if (!content) {
                alert("El mensaje no puede estar vacío.");
                return;
            }

            try {
                const authorName = currentUser.email ? currentUser.email.split('@')[0] : 'Ciudadano';

                const { error } = await supabaseClient
                    .from('forum_posts')
                    .insert({
                        user_id: currentUser.id,
                        author_name: authorName,
                        content: content
                    });

                if (error) {
                    alert("Error al publicar el mensaje.");
                    return;
                }

                document.getElementById('forum-content').value = '';
                loadForumPosts();
            } catch (err) {
                console.error("Error publicando en foro:", err);
                alert("Hubo un error al enviar el mensaje.");
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
