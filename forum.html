<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro Comunitario - Bit-Towns</title>
    <link rel="icon" type="image/png" href="favicon.png?v=1">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            padding: 18px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #00f0ff, #9d4edd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .nav-links {
            display: flex;
            gap: 12px;
        }
        .btn-nav {
            color: #00f0ff;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 8px 18px;
            border-radius: 24px;
            background: rgba(0, 240, 255, 0.05);
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .btn-nav:hover {
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
        }
        .btn-profile {
            color: #ffb703;
            border-color: rgba(255, 183, 3, 0.4);
            background: rgba(255, 183, 3, 0.08);
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .container {
            max-width: 960px;
            width: 100%;
            margin: 35px auto;
            padding: 0 24px;
            box-sizing: border-box;
            flex: 1;
        }

        .section-title {
            color: #f8fafc;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .section-desc {
            color: #94a3b8;
            font-size: 0.92rem;
            margin-bottom: 24px;
        }

        .forum-post-card {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.04), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(0, 255, 136, 0.25);
            padding: 24px;
            border-radius: 18px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.92rem;
            margin-bottom: 14px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
        }
        .form-textarea {
            resize: vertical;
            min-height: 90px;
        }
        .form-input:focus, .form-textarea:focus {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .btn-action {
            background: linear-gradient(135deg, #00ff88, #00f0ff);
            color: #0b0f19;
            border: none;
            padding: 12px 22px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.25s ease;
        }
        .btn-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }

        /* Estilo de Mensaje / Hilo en formato Foro Pro */
        .post-box {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 16px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 200px 1fr;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: border-color 0.2s;
        }
        @media (max-width: 768px) {
            .post-box {
                grid-template-columns: 1fr;
            }
        }
        .post-box:hover {
            border-color: rgba(0, 240, 255, 0.45);
        }

        /* Columna de Usuario (Perfil Izquierda) */
        .user-panel {
            background: rgba(11, 15, 25, 0.9);
            border-right: 1px solid rgba(0, 240, 255, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
        }
        @media (max-width: 768px) {
            .user-panel {
                border-right: none;
                border-bottom: 1px solid rgba(0, 240, 255, 0.1);
                flex-direction: row;
                justify-content: flex-start;
                gap: 15px;
                text-align: left;
                padding: 14px 20px;
            }
        }
        .user-avatar {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        @media (max-width: 768px) {
            .user-avatar {
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
                margin-bottom: 0;
            }
        }
        .user-name {
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            word-break: break-all;
            margin-bottom: 4px;
        }
        .user-badge {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.3);
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .user-stats {
            font-size: 0.78rem;
            color: #94a3b8;
            line-height: 1.3;
        }

        /* Columna de Contenido (Derecha) */
        .content-panel {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .post-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #64748b;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .thread-main-title {
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-decoration: none;
            display: block;
        }
        .thread-main-title:hover {
            color: #00f0ff;
        }
        .post-text {
            color: #cbd5e1;
            font-size: 0.92rem;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }
        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
        }
        .btn-delete {
            background: rgba(255, 75, 75, 0.12);
            color: #ff4b4b;
            border: 1px solid rgba(255, 75, 75, 0.3);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background: rgba(255, 75, 75, 0.25);
        }
        .back-link {
            display: inline-block;
            color: #00f0ff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <span style="font-size: 1.8rem;">💬</span>
            <h1>Foro Comunitario — Bit-Towns</h1>
        </div>
        <div class="nav-links">
            <a href="board.html" class="btn-nav">🏛️ Tablero</a>
            <a href="profile.html" class="btn-profile">👤 Mi Perfil</a>
            <a href="index.html" class="btn-nav">🏠 Inicio</a>
        </div>
    </div>

    <div class="container" id="main-container">
        <div style="text-align: center; color: #94a3b8; padding: 40px;">Cargando foro...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cxpsktskbvrkwtkolrpl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4cHNrdHNrYnZya3d0a29scnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTc1MjUsImV4cCI6MjEwNzAzMzUyNX0.9RJAEUxalZ3oI9DVWDr8x9s4QPpxWXZwMQBRm9lwVq0';

        let supabaseClient;
        let currentUser = null;
        const ADMIN_EMAIL = 'edgartp89@gmail.com'; 
        let userMessageCounts = {};

        window.addEventListener('DOMContentLoaded', async () => {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                alert("Debes iniciar sesión para acceder al foro.");
                window.location.href = 'login.html';
                return;
            }

            currentUser = session.user;
            await loadUserStats();

            const urlParams = new URLSearchParams(window.location.search);
            const threadId = urlParams.get('id');

            if (threadId) {
                loadThreadDetail(threadId);
            } else {
                loadThreadsList();
            }
        });

        // Calcular cuántos mensajes/hilos lleva cada usuario para mostrarlos en su tarjeta
        async function loadUserStats() {
            try {
                const { data: threads } = await supabaseClient.from('forum_threads').select('user_id');
                const { data: replies } = await supabaseClient.from('forum_replies').select('user_id');

                userMessageCounts = {};
                if (threads) {
                    threads.forEach(t => {
                        if (t.user_id) userMessageCounts[t.user_id] = (userMessageCounts[t.user_id] || 0) + 1;
                    });
                }
                if (replies) {
                    replies.forEach(r => {
                        if (r.user_id) userMessageCounts[r.user_id] = (userMessageCounts[r.user_id] || 0) + 1;
                    });
                }
            } catch (err) {
                console.error("Error calculando estadísticas de usuario:", err);
            }
        }

        // VISTA 1: Lista de Temas
        async function loadThreadsList() {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="forum-post-card">
                    <div style="color: #00ff88; font-weight: 700; margin-bottom: 6px; font-size: 1.1rem;">✍️ Abrir Nuevo Tema de Debate</div>
                    <div style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 18px;">Crea un título claro para tu propuesta y comparte los detalles con la comunidad.</div>
                    
                    <input type="text" id="thread-title" class="form-input" placeholder="Título del tema (ej. Propuesta para el Pont Colgant)..." />
                    <textarea id="thread-content" class="form-textarea" placeholder="Escribe el contenido de tu mensaje..."></textarea>
                    <button class="btn-action" onclick="createThread()">Publicar Tema</button>
                </div>

                <div class="section-title">Temas Activos</div>
                <div class="section-desc">Debates organizados por los ciudadanos de Amposta. Pincha en un título para entrar a leer y responder.</div>
                <div id="threads-container">
                    <div style="text-align: center; color: #94a3b8; padding: 40px;">Cargando debates...</div>
                </div>
            `;

            const threadsContainer = document.getElementById('threads-container');
            try {
                const { data, error } = await supabaseClient
                    .from('forum_threads')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (!error && data && data.length > 0) {
                    threadsContainer.innerHTML = '';
                    const isUserAdmin = currentUser && currentUser.email === ADMIN_EMAIL;

                    data.forEach(thread => {
                        const dateFormatted = new Date(thread.created_at).toLocaleString();
                        const msgCount = userMessageCounts[thread.user_id] || 1;
                        const author = thread.author_name || 'Ciudadano';
                        const isAdminAuthor = author.includes('edgartp89') || thread.user_id === currentUser?.id && currentUser?.email === ADMIN_EMAIL; // o similar

                        const postBox = document.createElement('div');
                        postBox.className = 'post-box';

                        let modBtn = '';
                        if (isUserAdmin || (currentUser && thread.user_id === currentUser.id)) {
                            modBtn = `<button class="btn-delete" onclick="deleteThread(${thread.id})">🗑️ Borrar Tema</button>`;
                        }

                        postBox.innerHTML = `
                            <div class="user-panel">
                                <div class="user-avatar">🏙️</div>
                                <div>
                                    <div class="user-name">${escapeHtml(author)}</div>
                                    <div class="user-badge">${thread.user_id === ADMIN_EMAIL || author === 'edgartp89' ? '🛡️ Admin' : '💬 Ciudadano'}</div>
                                    <div class="user-stats">📊 Mensajes: <b>${msgCount}</b></div>
                                </div>
                            </div>
                            <div class="content-panel">
                                <div>
                                    <div class="post-header-info">
                                        <span>📅 ${dateFormatted}</span>
                                        <span>#HiloPrincipal</span>
                                    </div>
                                    <a href="forum.html?id=${thread.id}" class="thread-main-title">📌 ${escapeHtml(thread.title)}</a>
                                    <div class="post-text">${escapeHtml(thread.content)}</div>
                                </div>
                                <div class="post-footer">
                                    <a href="forum.html?id=${thread.id}" style="color: #00f0ff; text-decoration: none; font-size: 0.88rem; font-weight: 600;">💬 Ver respuestas y debatir &rarr;</a>
                                    ${modBtn}
                                </div>
                            </div>
                        `;
                        threadsContainer.appendChild(postBox);
                    });
                } else {
                    threadsContainer.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 40px; background: rgba(15, 23, 42, 0.4); border-radius: 14px; border: 1px dashed rgba(255,255,255,0.1);">Aún no hay temas de debate creados. ¡Sé el primero en abrir uno!</div>`;
                }
            } catch (err) {
                threadsContainer.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 20px;">Error al cargar los temas.</div>`;
            }
        }

        // VISTA 2: Detalle del hilo y respuestas con tarjetas de usuario
        async function loadThreadDetail(threadId) {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <a href="forum.html" class="back-link">&larr; Volver a la lista de debates</a>
                <div id="single-thread-container"></div>
                
                <div class="forum-post-card" style="margin-top: 30px;">
                    <div style="color: #00ff88; font-weight: 700; margin-bottom: 6px; font-size: 1.05rem;">💬 Escribe una respuesta al debate</div>
                    <textarea id="reply-content" class="form-textarea" placeholder="Escribe tu opinión o aportación..."></textarea>
                    <button class="btn-action" onclick="createReply(${threadId})">Enviar Respuesta</button>
                </div>

                <div class="section-title" style="margin-top: 35px;">Respuestas de la Comunidad</div>
                <div id="replies-container">
                    <div style="text-align: center; color: #94a3b8; padding: 30px;">Cargando respuestas...</div>
                </div>
            `;

            try {
                const { data: thread, error: threadError } = await supabaseClient
                    .from('forum_threads')
                    .select('*')
                    .eq('id', threadId)
                    .single();

                if (threadError || !thread) {
                    container.innerHTML = `<a href="forum.html" class="back-link">&larr; Volver</a><div style="color: #ff4b4b; text-align: center; padding: 40px;">El tema de debate no existe o ha sido eliminado.</div>`;
                    return;
                }

                const isUserAdmin = currentUser && currentUser.email === ADMIN_EMAIL;
                const threadContainer = document.getElementById('single-thread-container');
                const author = thread.author_name || 'Ciudadano';
                const msgCount = userMessageCounts[thread.user_id] || 1;

                let modBtn = '';
                if (isUserAdmin || (currentUser && thread.user_id === currentUser.id)) {
                    modBtn = `<button class="btn-delete" onclick="deleteThread(${thread.id}, true)">🗑️ Borrar Tema Completo</button>`;
                }

                threadContainer.innerHTML = `
                    <div class="post-box" style="border-color: #00ff88;">
                        <div class="user-panel">
                            <div class="user-avatar" style="background: linear-gradient(135deg, #00ff88, #00f0ff);">🏛️</div>
                            <div>
                                <div class="user-name">${escapeHtml(author)}</div>
                                <div class="user-badge">📌 Autor del Hilo</div>
                                <div class="user-stats">📊 Mensajes: <b>${msgCount}</b></div>
                            </div>
                        </div>
                        <div class="content-panel">
                            <div>
                                <div class="post-header-info">
                                    <span>📅 ${new Date(thread.created_at).toLocaleString()}</span>
                                    <span>#TemaPrincipal</span>
                                </div>
                                <div class="thread-main-title" style="font-size: 1.25rem;">📌 ${escapeHtml(thread.title)}</div>
                                <div class="post-text">${escapeHtml(thread.content)}</div>
                            </div>
                            <div class="post-footer">
                                <span></span>
                                ${modBtn}
                            </div>
                        </div>
                    </div>
                `;

                loadReplies(threadId);
            } catch (err) {
                console.error("Error cargando detalle:", err);
            }
        }

        async function loadReplies(threadId) {
            const repliesContainer = document.getElementById('replies-container');
            try {
                const { data: replies, error } = await supabaseClient
                    .from('forum_replies')
                    .select('*')
                    .eq('thread_id', threadId)
                    .order('created_at', { ascending: true });

                if (!error && replies && replies.length > 0) {
                    repliesContainer.innerHTML = '';
                    const isUserAdmin = currentUser && currentUser.email === ADMIN_EMAIL;

                    replies.forEach(reply => {
                        const author = reply.author_name || 'Ciudadano';
                        const msgCount = userMessageCounts[reply.user_id] || 1;
                        const postBox = document.createElement('div');
                        postBox.className = 'post-box';

                        let deleteReplyBtn = '';
                        if (isUserAdmin || (currentUser && reply.user_id === currentUser.id)) {
                            deleteReplyBtn = `<button class="btn-delete" onclick="deleteReply(${reply.id}, ${threadId})">🗑️ Borrar Respuesta</button>`;
                        }

                        postBox.innerHTML = `
                            <div class="user-panel">
                                <div class="user-avatar" style="background: linear-gradient(135deg, #7000ff, #9d4edd);">💬</div>
                                <div>
                                    <div class="user-name">${escapeHtml(author)}</div>
                                    <div class="user-badge" style="background: rgba(112, 0, 255, 0.15); color: #b197fc; border-color: rgba(112, 0, 255, 0.3);">👤 Participante</div>
                                    <div class="user-stats">📊 Mensajes: <b>${msgCount}</b></div>
                                </div>
                            </div>
                            <div class="content-panel">
                                <div>
                                    <div class="post-header-info">
                                        <span>📅 ${new Date(reply.created_at).toLocaleString()}</span>
                                        <span>#Respuesta</span>
                                    </div>
                                    <div class="post-text">${escapeHtml(reply.content)}</div>
                                </div>
                                <div class="post-footer">
                                    <span></span>
                                    ${deleteReplyBtn}
                                </div>
                            </div>
                        `;
                        repliesContainer.appendChild(postBox);
                    });
                } else {
                    repliesContainer.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 30px; background: rgba(15, 23, 42, 0.4); border-radius: 12px; border: 1px dashed rgba(255,255,255,0.08);">Aún no hay respuestas en este debate. ¡Sé el primero en contestar!</div>`;
                }
            } catch (err) {
                repliesContainer.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 20px;">Error al cargar las respuestas.</div>`;
            }
        }

        // Acciones
        async function createThread() {
            if (!currentUser) return;
            const title = document.getElementById('thread-title').value.trim();
            const content = document.getElementById('thread-content').value.trim();

            if (!title || !content) {
                alert("El título y el contenido son obligatorios.");
                return;
            }

            try {
                const authorName = currentUser.email ? currentUser.email.split('@')[0] : 'Ciudadano';
                const { error } = await supabaseClient.from('forum_threads').insert({
                    user_id: currentUser.id,
                    author_name: authorName,
                    title: title,
                    content: content
                });

                if (error) { alert("Error al publicar el tema."); return; }
                await loadUserStats();
                loadThreadsList();
            } catch (err) {
                console.error("Error:", err);
            }
        }

        async function createReply(threadId) {
            if (!currentUser) return;
            const content = document.getElementById('reply-content').value.trim();

            if (!content) {
                alert("La respuesta no puede estar vacía.");
                return;
            }

            try {
                const authorName = currentUser.email ? currentUser.email.split('@')[0] : 'Ciudadano';
                const { error } = await supabaseClient.from('forum_replies').insert({
                    thread_id: threadId,
                    user_id: currentUser.id,
                    author_name: authorName,
                    content: content
                });

                if (error) { alert("Error al enviar la respuesta."); return; }
                document.getElementById('reply-content').value = '';
                await loadUserStats();
                loadReplies(threadId);
            } catch (err) {
                console.error("Error:", err);
            }
        }

        async function deleteThread(threadId, redirectToList = false) {
            if (!confirm("¿Seguro que deseas eliminar este hilo completo y todas sus respuestas?")) return;

            try {
                const { error } = await supabaseClient.from('forum_threads').delete().eq('id', threadId);
                if (error) { alert("Error al eliminar el tema."); return; }

                alert("Tema eliminado.");
                await loadUserStats();
                if (redirectToList) {
                    window.location.href = 'forum.html';
                } else {
                    loadThreadsList();
                }
            } catch (err) {
                console.error("Error:", err);
            }
        }

        async function deleteReply(replyId, threadId) {
            if (!confirm("¿Deseas eliminar esta respuesta?")) return;

            try {
                const { error } = await supabaseClient.from('forum_replies').delete().eq('id', replyId);
                if (error) { alert("Error al eliminar la respuesta."); return; }
                await loadUserStats();
                loadReplies(threadId);
            } catch (err) {
                console.error("Error:", err);
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
