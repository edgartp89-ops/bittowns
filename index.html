<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bit-Towns</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 20px;
        }
        img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.4);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #a0aec0;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Aquí puedes subir tu banner guardado como banner.png -->
        <img src="banner.png" alt="Bit-Towns Banner">
        <h1>Bit-Towns</h1>
        <p>Construye. Gobierna. Recompensa.</p>
        <a href="https://x.com" class="btn" target="_blank">Síguenos en X</a>
    </div>
</body>
</html>
