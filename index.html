<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bit-Towns</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center; /* Centra todo el contenido verticalmente en la pantalla */
            min-height: 100vh;
            box-sizing: border-box;
        }
        .main-container {
            display: flex;
            flex-direction: column; /* Apila los elementos verticalmente */
            max-width: 650px; /* Un ancho contenido para que no se disperse mucho en pantallas gigantes */
            width: 100%;
            padding: 20px;
            gap: 20px; /* Espacio entre el banner y el bloque de texto */
            align-items: center; /* Centra los elementos horizontalmente dentro del contenedor */
        }
        
        /* Bloque de texto que va debajo del banner */
        .text-block {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            text-align: center; /* Texto centrado */
        }

        img.banner {
            width: 100%;
            max-width: 600px; /* El banner ocupa un gran ancho pero controlado */
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(112, 0, 255, 0.4);
            display: block; /* Evita espacios extra debajo de la imagen */
        }
        h1 {
            font-size: 2.2rem;
            margin: 0;
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: #a0aec0;
            font-size: 1.1rem;
            margin: 0;
        }
        .pillars {
            display: flex;
            flex-direction: row; /* Los pilares en horizontal para aprovechar el ancho */
            gap: 15px;
            margin: 15px 0;
            justify-content: center;
        }
        .pillar-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 10px;
            border-radius: 8px;
            flex: 1; /* Las tarjetas se reparten el ancho disponible equitativamente */
            max-width: 180px; /* Controla que no se hagan gigantes en pantallas muy anchas */
        }
        .pillar-card h3 {
            margin: 0 0 4px 0;
            color: #00f0ff;
            font-size: 0.9rem;
        }
        .pillar-card p {
            margin: 0;
            color: #a0aec0;
            font-size: 0.8rem;
            line-height: 1.3;
        }
        .btn {
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            display: inline-block;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        /* Adaptabilidad para móviles (se mantiene igual de bien) */
        @media (max-width: 700px) {
            .main-container {
                padding: 15px;
                gap: 15px;
            }
            img.banner {
                max-width: 100%;
            }
            h1 { font-size: 1.8rem; }
            p.subtitle { font-size: 1rem; }
            .pillars {
                flex-direction: column; /* Los pilares se apilan en vertical en móvil */
                gap: 10px;
                width: 100%;
            }
            .pillar-card {
                max-width: 100%; /* Las tarjetas ocupan todo el ancho en móvil */
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- EL BANNER SIGUE ESTANDO ARRIBA -->
        <img src="banner.png" alt="Bit-Towns Banner" class="banner">
        
        <!-- BLOQUE DE TEXTO DEBAJO -->
        <div class="text-block">
            <h1>Bit-Towns</h1>
            <p class="subtitle">El primer constructor de ciudades Phygital.</p>
            
            <div class="pillars">
                <div class="pillar-card">
                    <h3>🗺️ Construye</h3>
                    <p>Fusiona el mapa real de tu ciudad con el juego.</p>
                </div>
                <div class="pillar-card">
                    <h3>⚖️ Gobierna</h3>
                    <p>Decide el rumbo de tu comunidad de forma descentralizada.</p>
                </div>
                <div class="pillar-card">
                    <h3>🎁 Recompensa</h3>
                    <p>Obtén tokens $TOWN y activos digitales por tu actividad física.</p>
                </div>
            </div>

            <div style="margin-top: 10px;">
                <a href="https://x.com/BitTowns" class="btn" target="_blank">Síguenos en X</a>
            </div>
        </div>
    </div>
</body>
</html>
